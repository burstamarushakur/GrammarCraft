 matches the comparison!","taskLabel":"Castle comparison solved","reminder":"Taller and shorter compare heights. Bigger and smaller compare sizes. Than tells us which other object to compare with.","tasks":[{"prompt":"Look at the two towers. Tap the taller tower.","objects":[{"id":"a","label":"Tower A","size":80},{"id":"b","label":"Tower B","size":150}],"objectType":"tower","answer":"b","full":"Tower B is taller than Tower A.","hint":"Taller means higher. Tower B reaches higher than Tower A.","explain":"Tower B is taller than Tower A. We compare their heights."},{"prompt":"Look at the two chests. Tap the smaller chest.","objects":[{"id":"a","label":"Chest A","size":75},{"id":"b","label":"Chest B","size":130}],"objectType":"chest","answer":"a","full":"Chest A is smaller than Chest B.","hint":"Smaller means less big. Chest A is the little chest.","explain":"Chest A is smaller than Chest B. We compare their sizes."},{"prompt":"Find Tower A first. Tap the tower that is shorter than Tower A.","objects":[{"id":"a","label":"Tower A","size":110},{"id":"b","label":"Tower B","size":70},{"id":"c","label":"Tower C","size":155}],"objectType":"tower","answer":"b","full":"Tower B is shorter than Tower A.","hint":"Look for a tower lower than Tower A. Tower B is lower.","explain":"Tower B is shorter than Tower A. Tower C is taller than Tower A."},{"prompt":"Find Chest B first. Tap the chest that is bigger than Chest B.","objects":[{"id":"a","label":"Chest A","size":70},{"id":"b","label":"Chest B","size":105},{"id":"c","label":"Chest C","size":145}],"objectType":"chest","answer":"c","full":"Chest C is bigger than Chest B.","hint":"Look for a chest larger than Chest B. Chest C is larger.","explain":"Chest C is bigger than Chest B. Chest A is smaller than Chest B."},{"prompt":"Find Tower B first. Tap the tower that is taller than Tower B.","objects":[{"id":"a","label":"Tower A","size":75},{"id":"b","label":"Tower B","size":110},{"id":"c","label":"Tower C","size":155}],"objectType":"tower","answer":"c","full":"Tower C is taller than Tower B.","hint":"Look for a tower higher than Tower B. Tower C is higher.","explain":"Tower C is taller than Tower B. Tower A is shorter than Tower B."}]}],"rules":[["shop","Picnic amounts","many carrots · much milk · some bread · isn't any juice","Use many for things we count and much for an amount. These positive sentences use some. These negative sentences use any.","How many carrots are there? There is some bread. There isn't any juice."],["bridge","Who owns it?","hers · mine · yours · Whose ...? · Ali's","Mine, yours and hers can stand alone. Whose asks about an owner. Add 's for one owner, or an apostrophe after a plural ending in s.","Whose bike is this? It is Ali's bike. The cats' toys belong to the cats."],["train","Every day or now?","I feed every day. · I am feeding now.","A routine uses the present simple. An action happening now uses am, is or are and an -ing word.","Hana waters the flowers every day. The cat is sleeping now."],["boat","Activities and wishes","enjoy + ing · love + ing · want + to + verb","Use an -ing activity after enjoy. Love can also go with an -ing activity. Use to and a base verb after want.","I enjoy playing games. Aina wants to drink water."],["pickaxe","Past actions and skills","helped · went · saw · could + base verb","Some past verbs add ed. Others change: go becomes went and see becomes saw. Could tells us about a past ability.","Yesterday, Sara helped her mum. Nora could ride a bike when she was six."],["portal","Our plans","am / is / are + going to + base verb","Use going to for these future plans. Match am, is or are to the person. Keep the action verb in its base form.","I am going to plant seeds. They are going to visit the park."],["cat","Ask and give a reason","Why ...? · because + a reason","Why asks for a reason. Because explains the reason for an action or an opinion.","Why do you like the cat? I like it because it is friendly."],["castle","Compare two things","taller than · shorter than · bigger than · smaller than","Taller and shorter compare heights. Bigger and smaller compare sizes. Read which object comes after than before you choose.","Tower C is taller than Tower B. Chest A is smaller than Chest B."]],"curriculum":{"document":"KSSR (Semakan 2017) Standards-Based English Language Curriculum, Sekolah Kebangsaan, Year 4; Bahagian Pembangunan Kurikulum, Ministry of Education Malaysia, April 2018","title":"English Language Year 4 (SK) DSKP — Primary Year 4 Syllabus","url":"https://bpk.moe.gov.my/kurikulum/kssr/kssr-tahun-3-1/138-003-dskp-kssr-semakan-2017-bi-sk-thn4-print/file","grammarPages":"Printed syllabus pages 45–47 (PDF pages 59–61); earlier grammar in Appendix 1, printed pages 53–54 (PDF pages 67–68). Relevant learning standards: printed pages 26, 31 and 35–36 (PDF pages 40, 45 and 49–50).","learningStandards":["4.2.1: Language for giving reasons for simple opinions, supported here by because sentences.","4.2.3: Language for describing basic daily routines, supported here by guided sentence ordering.","4.2.4: Suitable language for describing people and objects, supported here by ownership and comparison statements.","4.3.1: Capital letters and sentence punctuation, practised here in guided word ordering; the full standard concerns writing at discourse level.","2.1.2: Language for describing past experiences; classroom speaking practice is needed to assess the full standard.","3.2.2: Reading for specific details is supported by short clues; the full standard expects simple texts of one or two paragraphs."],"note":"Original scaffolded practice for class 4K, using selected Year 4 SK grammar: quantities, ownership, verb + ing or infinitive, regular and irregular past forms, could, going to, why/because and short-adjective comparisons. The Year 4 syllabus explicitly recycles present simple and present continuous, used together here to contrast routines and actions now. Small choices, short word banks, direct hints, audio and retries support pupils step by step. This is a selected practice pack, not coverage of every Year 4 grammar item or a complete assessment of a DSKP learning standard or PBD performance level."}},"y5-high":{"year":5,"levelLabel":"Challenge","missions":[{"id":"y5-market","title":"Village Café","subtitle":"Check the supplies","topic":"much · many · there is / are · also","type":"rune","color":"#ffbd64","icon":"shop","x":18,"y":72,"guide":"Read the café clues. Tap the correct message block to help the cooks!","taskLabel":"Café supply checked","tasks":[{"prompt":"The café has ten apples but only a little juice. Choose the message with correct grammar.","options":["There are many apples, but there isn't much juice.","There is many apples, but there aren't much juice.","There are much apples, but there isn't many juice."],"answer":"There are many apples, but there isn't much juice.","full":"There are many apples, but there isn't much juice.","hint":"Apples can be counted: many apples. Juice is a liquid: much juice. Match are to apples and is to juice.","explain":"Use many with countable apples and much with uncountable juice. The verb also matches the noun.","scene":"apple"},{"prompt":"The cook needs six bananas. You want to check the number of bananas on the table. Choose a correct question.","options":["How much bananas is there?","How many bananas are there?","How many banana is there?"],"answer":"How many bananas are there?","full":"How many bananas are there?","hint":"Ask How many about a number of things you can count. Bananas is plural.","explain":"How many asks for a number. Use the plural bananas and the question order are there.","scene":"apple"},{"prompt":"There are two bottles on the shelf. Both contain water. Fix the cook's note: 'There is two bottles of water.'","options":["There are two bottles of water.","There is two bottle of water.","There are two bottle of waters."],"answer":"There are two bottles of water.","full":"There are two bottles of water.","hint":"The sentence counts bottles, not the water inside them. Two bottles needs are.","explain":"Bottles is the plural noun that controls the verb. Use There are two bottles of water.","scene":"friends"},{"prompt":"The cook has plenty of rice. She does not know the amount of rice needed for the meal. Choose the question to ask her.","options":["How many rice do we need?","How much rices do we need?","How much rice do we need?"],"answer":"How much rice do we need?","full":"How much rice do we need?","hint":"Rice is uncountable here. Ask about its amount with How much.","explain":"Use How much with uncountable rice. Do not add s to rice.","scene":"friends"},{"prompt":"Ravi enjoys fruit. He enjoys sandwiches too. Choose the correct sentence that adds this second fact using also.","options":["He also enjoy sandwiches.","He also enjoys sandwiches.","He also enjoying sandwiches."],"answer":"He also enjoys sandwiches.","full":"Ravi enjoys fruit. He also enjoys sandwiches.","hint":"Also adds another fact. A routine or preference with he needs enjoys.","explain":"Also adds the second preference. Use enjoys after he in the present simple.","scene":"boy"}]},{"id":"y5-bridge","title":"Message Bridge","subtitle":"Connect the explorers","topic":"object pronouns · and · or · but · so · because","type":"bridge","color":"#80d4ea","icon":"bridge","x":38,"y":56,"guide":"Choose messages that connect ideas clearly. Each correct message builds the bridge!","taskLabel":"Message delivered","tasks":[{"prompt":"Mina dropped two maps. You picked up both maps. Complete her message: 'I dropped the maps, so you picked ___ up.'","options":["they","him","them"],"answer":"them","full":"I dropped the maps, so you picked them up.","hint":"Both maps is plural. The word after picked refers to the things that received the action.","explain":"Them is an object pronoun for the two maps. They is a subject pronoun.","scene":"girl"},{"prompt":"Ravi can run fast. He cannot climb the high wall. Choose the word that shows this contrast: 'He can run fast, ___ he cannot climb the wall.'","options":["but","because","so"],"answer":"but","full":"He can run fast, but he cannot climb the wall.","hint":"You need a word that contrasts an ability with something he cannot do.","explain":"But connects contrasting ideas: he can do one thing, but he cannot do the other.","scene":"boy"},{"prompt":"Only one route can open. The team must choose between the train and the boat. Complete the choice: 'We can take the train ___ the boat.'","options":["so","and","or"],"answer":"or","full":"We can take the train or the boat.","hint":"The team has two alternatives and must choose one.","explain":"Or presents alternatives. And would join both forms of transport rather than show this choice.","scene":"friends"},{"prompt":"The bridge was broken. As a result, the team took the boat. Choose the word that shows the result: 'The bridge was broken, ___ we took the boat.'","options":["because","so","or"],"answer":"so","full":"The bridge was broken, so we took the boat.","hint":"The first part gives a problem. The second part tells you what happened as a result.","explain":"So introduces the result of the broken bridge: the team took the boat.","scene":"friends"},{"prompt":"Aisha is lost. Ben gives Aisha a map. Choose the sentence that uses the correct pronouns and gives the reason.","options":["Ben gives she a map because her is lost.","Ben gives him a map because she is lost.","Ben gives her a map because she is lost."],"answer":"Ben gives her a map because she is lost.","full":"Ben gives her a map because she is lost.","hint":"Aisha receives the map: use her. Aisha is the subject of is lost: use she. Because introduces the reason.","explain":"Use object pronoun her after gives and subject pronoun she before is. Because explains why Ben gives the map.","scene":"girl"}]},{"id":"y5-train","title":"Timetable Train","subtitle":"Build questions and routines","topic":"What time · How often · frequency · present simple","type":"train","color":"#a8d884","icon":"train","x":17,"y":34,"guide":"Use the clues to build each question or routine. Put every carriage in the correct order!","taskLabel":"Timetable message ready","tasks":[{"prompt":"Nora checks her compass every morning. Ask about the frequency of this action. Start with How and finish with compass?","words":["How","often","does","Nora","check","her","compass?"],"answer":"How often does Nora check her compass?","full":"How often does Nora check her compass?","hint":"Use How often to ask about frequency. Put does before Nora, then use check without s.","explain":"How often asks about frequency. In a present simple question, does is followed by the subject and the base verb.","scene":"girl"},{"prompt":"You know the train leaves in the morning, but you need its exact departure time. Build a question. Start with What and finish with leave?","words":["What","time","does","the","train","leave?"],"answer":"What time does the train leave?","full":"What time does the train leave?","hint":"Use What time for an exact time. Use does with the train, then the base verb leave.","explain":"What time asks for the departure time. After does, use leave rather than leaves.","scene":"friends"},{"prompt":"Mina visits the market on most days, but not every day. Build her routine with usually before the main verb. Start with Mina.","words":["Mina","usually","visits","the","market."],"answer":"Mina usually visits the market.","full":"Mina usually visits the market.","hint":"Usually means on most occasions. Place it before visits.","explain":"Usually expresses a regular action that does not happen every time. It comes before the main verb visits.","scene":"girl"},{"prompt":"The boat operates on Tuesdays and Fridays. It is closed on Mondays. Build the negative routine. Start with The and finish with Mondays.","words":["The","boat","does","not","sail","on","Mondays."],"answer":"The boat does not sail on Mondays.","full":"The boat does not sail on Mondays.","hint":"Use does not with the boat. The verb after does not is sail, without s.","explain":"Does not sail is the correct present simple negative for the boat. On Mondays tells us about a repeated routine.","scene":"friends"},{"prompt":"Your team is ready for every adventure. Build a sentence using always directly after are. Start with We and finish with adventure.","words":["We","are","always","ready","for","adventure."],"answer":"We are always ready for adventure.","full":"We are always ready for adventure.","hint":"A frequency adverb usually comes after am, is or are. Put always after are.","explain":"Always means every time. With the verb be, place the frequency adverb after the verb: are always.","scene":"friends"}]},{"id":"y5-river","title":"River Instructions","subtitle":"Guide the boat crew","topic":"imperatives · negative instructions · sequencing","type":"build","color":"#69c8e8","icon":"boat","x":56,"y":74,"guide":"Build clear instructions for the crew. Use the order clues to launch the boat!","taskLabel":"Crew instruction ready","tasks":[{"prompt":"Before a trip, the crew prepares drinking water. Build the first instruction. Start with First, and finish with water.","words":["First,","fill","the","bottle","with","clean","water."],"answer":"First, fill the bottle with clean water.","full":"First, fill the bottle with clean water.","hint":"First introduces the opening step. An instruction begins with a base verb such as fill.","explain":"First marks the start of the sequence. Fill is an imperative that tells the crew what to do.","scene":"friends"},{"prompt":"Running on the narrow bridge is unsafe. Build a clear negative instruction for the crew. Start with Do and finish with bridge.","words":["Do","not","run","on","the","bridge."],"answer":"Do not run on the bridge.","full":"Do not run on the bridge.","hint":"A negative instruction starts with Do not. Follow it with the base verb run.","explain":"Do not run is a negative imperative. It gives a clear instruction to avoid the unsafe action.","scene":"boy"},{"prompt":"The crew has put soil in a pot and added a seed. Now build the last instruction. Start with Finally, and finish with pot.","words":["Finally,","water","the","seed","in","the","pot."],"answer":"Finally, water the seed in the pot.","full":"Finally, water the seed in the pot.","hint":"Finally introduces the last step. Water is a verb here: it tells someone to give water to the seed.","explain":"Finally marks the end of the sequence. Water the seed is an imperative instruction.","scene":"friends"},{"prompt":"Before walking to the boat, explorers must check their map, then follow the path. Join the two instructions. Start with Check and finish with path.","words":["Check","your","map","and","follow","the","path."],"answer":"Check your map and follow the path.","full":"Check your map and follow the path.","hint":"Check and follow are instruction verbs. And joins the two instructions.","explain":"Both actions use the base verb because they are imperatives. And links the two steps.","scene":"friends"},{"prompt":"First, fold the map. The second step is to put it in your bag. Build that second instruction. Start with Next, and finish with bag.","words":["Next,","put","the","map","in","your","bag."],"answer":"Next, put the map in your bag.","full":"Next, put the map in your bag.","hint":"Next introduces the following step. Start the instruction itself with put.","explain":"Next shows the order of the steps. Put the map in your bag tells the explorer what to do after folding the map.","scene":"boy"}]},{"id":"y5-mine","title":"Story Mine","subtitle":"Repair the adventure diary","topic":"past simple · questions · negatives · past and now","type":"mine","color":"#acbcdf","icon":"pickaxe","x":68,"y":51,"guide":"Read the diary clues. Mine the correct sentence block to repair the story!","taskLabel":"Diary page repaired","tasks":[{"prompt":"The team searched the mine yesterday. They found no gold. Fix this diary sentence: 'We did not found any gold.'","options":["We did not find any gold.","We did not finds any gold.","We did not finding any gold."],"answer":"We did not find any gold.","full":"We did not find any gold.","hint":"Did not already shows the past. Use the base verb find after it.","explain":"A past simple negative uses did not plus the base verb. Found becomes find after did not.","scene":"friends"},{"prompt":"Rina joined the team yesterday. You are checking what she brought on that trip. Choose the correct past-tense question about the rope.","options":["Does she bring the rope yesterday?","Did she bring the rope?","Did she brought the rope?"],"answer":"Did she bring the rope?","full":"Did she bring the rope?","hint":"Ask about yesterday with Did. Follow the subject with the base verb bring.","explain":"Did marks the question as past simple. Use bring, not brought, after did.","scene":"girl"},{"prompt":"The diary says: First, we entered the mine. Next, we found a gem. After that, we went home. Choose the grammatically correct final diary sentence.","options":["After that, we go home yesterday.","After that, we goed home.","After that, we went home."],"answer":"After that, we went home.","full":"After that, we went home.","hint":"All three events are finished. Go has the irregular past form went.","explain":"Went is the past form of go. After that places this event after finding the gem.","scene":"friends"},{"prompt":"Last Saturday, the explorers made a safe path from wooden blocks. Complete their report: 'We ___ a safe path.'","options":["builded","built","build"],"answer":"built","full":"We built a safe path.","hint":"Last Saturday is a finished time. Build is irregular in the past: built.","explain":"Use built for the completed action last Saturday. Not all past-tense verbs end in ed.","scene":"friends"},{"prompt":"The adventure happened yesterday. The team is taking a rest at this moment. Choose the message that shows both times correctly.","options":["Yesterday, we explored the mine. Now, we are resting.","Yesterday, we explore the mine. Now, we rested.","Yesterday, we exploring the mine. Now, we are rest."],"answer":"Yesterday, we explored the mine. Now, we are resting.","full":"Yesterday, we explored the mine. Now, we are resting.","hint":"A finished action yesterday needs the past simple. An action happening now needs are plus an ing verb.","explain":"Explored describes the finished adventure. Are resting describes what the team is doing now.","scene":"friends"}]},{"id":"y5-portal","title":"Future Portal","subtitle":"Make plans and promises","topic":"will / won't · predictions · promises · going to","type":"portal","color":"#bea1fa","icon":"portal","x":80,"y":27,"guide":"Read each future clue. Choose a clear plan, prediction or promise to open the portal!","taskLabel":"Future message ready","tasks":[{"prompt":"Your friend cannot carry the heavy boxes alone. Choose a grammatically correct promise to help with the boxes tomorrow.","options":["I will helped you carry the boxes tomorrow.","I will help you carry the boxes tomorrow.","I will helping you carry the boxes tomorrow."],"answer":"I will help you carry the boxes tomorrow.","full":"I will help you carry the boxes tomorrow.","hint":"Use will for the promise. The verb immediately after will must be the base form help.","explain":"Will help expresses the promise. Will is followed by a base verb, even when the action is tomorrow.","scene":"friends"},{"prompt":"The weather report predicts heavy rain tomorrow. The team decides to stay indoors. Choose a message that matches the report and has correct grammar.","options":["It won't rain tomorrow, so we will stay indoors.","It will rains tomorrow, so we will stay indoors.","It will rain tomorrow, so we will stay indoors."],"answer":"It will rain tomorrow, so we will stay indoors.","full":"It will rain tomorrow, so we will stay indoors.","hint":"The prediction is rain, not no rain. After will, use rain without s. So introduces the team's decision.","explain":"Will rain gives the prediction. Will stay uses another base verb, and so connects the prediction to the decision.","scene":"friends"},{"prompt":"Mei has bought seeds and prepared pots. She has a plan for tomorrow. Choose the correct sentence describing that plan.","options":["She is going to plant the seeds tomorrow.","She are going to plant the seeds tomorrow.","She is going to planted the seeds tomorrow."],"answer":"She is going to plant the seeds tomorrow.","full":"She is going to plant the seeds tomorrow.","hint":"For this plan, use She is going to followed by the base verb plant.","explain":"Is going to plant describes Mei's planned action. Use is with she and the base verb after going to.","scene":"girl"},{"prompt":"A bird has a broken wing. The vet predicts it will need several days of rest. Choose a grammatically correct negative prediction for today.","options":["It won't flew today.","It won't fly today.","It won't flying today."],"answer":"It won't fly today.","full":"It won't fly today.","hint":"Won't means will not. It is followed by the base verb fly.","explain":"Won't fly is a negative prediction. Use fly rather than flew or flying after won't.","scene":"friends"},{"prompt":"The explorers have made a plan for next week. You want to check whether their plan is to visit the village. Choose the correctly formed question.","options":["Are they going to visiting the village?","Is they going to visit the village?","Are they going to visit the village?"],"answer":"Are they going to visit the village?","full":"Are they going to visit the village?","hint":"Use are with they. In the question, place Are before they and use visit after going to.","explain":"Are they going to visit is the question form of They are going to visit. The main verb stays in its base form.","scene":"friends"}]},{"id":"y5-rescue","title":"Rescue Camp","subtitle":"Use your skills and ask permission","topic":"can / can't · ability · permission · verb + ing","type":"rune","color":"#ff9c95","icon":"cat","x":46,"y":31,"guide":"Choose the right rescue message. Think about skills, permission and what each explorer enjoys!","taskLabel":"Rescue plan approved","tasks":[{"prompt":"Mina climbs trees easily, but she is unable to swim. Choose a correct sentence that reports both abilities.","options":["Mina can climb, but she can't swim.","Mina cans climb, but she can't swim.","Mina can swim, but she can't climb."],"answer":"Mina can climb, but she can't swim.","full":"Mina can climb, but she can't swim.","hint":"Can describes an ability. Can't describes something she is unable to do. Do not add s to can.","explain":"Can climb and can't swim match the clues. Can has the same form with every subject.","scene":"girl"},{"prompt":"You need the teacher's book for the rescue plan. Choose a grammatically correct, polite question asking permission to use it.","options":["Can I using your book, please?","Can I use your book, please?","Can I uses your book, please?"],"answer":"Can I use your book, please?","full":"Can I use your book, please?","hint":"A permission question starts Can I. Put the base verb use after I.","explain":"Can I use asks permission. Please makes the request polite. The verb after can stays in its base form.","scene":"boy"},{"prompt":"The path is closed. The captain refuses the request, 'Can we use this path?' Choose the reply that clearly refuses permission.","options":["No, you can. The path is closed.","No, you don't. The path is closed.","No, you can't. The path is closed."],"answer":"No, you can't. The path is closed.","full":"No, you can't. The path is closed.","hint":"Match a question with can to a short answer with can or can't. Refusing permission needs can't.","explain":"No, you can't refuses permission. The closed path gives the reason.","scene":"friends"},{"prompt":"The captain owns a locked chest. Your team must ask permission before opening it. Choose a correctly formed question from the team.","options":["Can we open the chest?","Can we opening the chest?","Can we opens the chest?"],"answer":"Can we open the chest?","full":"Can we open the chest?","hint":"For the standard question form, put Can before we, then add the base verb open.","explain":"Can we open is the standard question order for requesting permission. Use open rather than opens.","scene":"friends"},{"prompt":"Ben likes swimming, but he dislikes running. Choose the sentence that expresses his preferences and has correct grammar.","options":["He enjoys swim, but he does not like running.","He enjoys swimming, but he does not like running.","He enjoys running, but he does not like swimming."],"answer":"He enjoys swimming, but he does not like running.","full":"He enjoys swimming, but he does not like running.","hint":"Enjoy is followed by a verb ending in ing. Check that both activities match Ben's preferences.","explain":"Enjoys swimming uses the ing form after enjoy. But connects Ben's contrasting preferences.","scene":"boy"}]},{"id":"y5-castle","title":"Castle Logic","subtitle":"Solve the comparison clues","topic":"comparatives · superlatives · connected clues","type":"compare","color":"#e5b3f0","icon":"castle","x":62,"y":13,"guide":"Use every comparison clue. Tap the tower or chest that meets the whole instruction!","taskLabel":"Castle clue solved","tasks":[{"prompt":"The scout needs a tower taller than Tower A but shorter than Tower C. Choose the tower that meets both clues.","answer":"b","full":"Tower B is taller than Tower A but shorter than Tower C.","objects":[{"id":"a","label":"Tower A","size":76},{"id":"b","label":"Tower B","size":113},{"id":"c","label":"Tower C","size":154}],"hint":"You need the middle height. The answer cannot be the shortest or the tallest tower.","explain":"Tower B meets both comparisons: it is taller than A and shorter than C."},{"prompt":"The boat needs a chest bigger than Chest A but smaller than Chest B. Choose a chest that meets both size clues.","answer":"c","full":"Chest C is bigger than Chest A but smaller than Chest B.","objectType":"chest","objects":[{"id":"a","label":"Chest A","size":76},{"id":"b","label":"Chest B","size":150},{"id":"c","label":"Chest C","size":112}],"hint":"Compare all three chests. Look for a chest in the middle of the two named sizes.","explain":"Chest C is the middle size. Bigger and smaller compare it with the two other chests."},{"prompt":"Tower C is taller than Tower B. Tower A is shorter than Tower B. Choose the second-tallest tower.","answer":"b","full":"Tower B is the second-tallest tower.","objects":[{"id":"a","label":"Tower A","size":76},{"id":"b","label":"Tower B","size":116},{"id":"c","label":"Tower C","size":155}],"hint":"First find the tallest tower. The next tower in height is the second-tallest.","explain":"C is tallest and A is shortest. B is the second-tallest because it is between them in height."},{"prompt":"The ladder reaches only towers shorter than Tower B. Of those towers, choose the tallest one it can reach.","answer":"c","full":"Tower C is the tallest tower that is shorter than Tower B.","objects":[{"id":"a","label":"Tower A","size":76},{"id":"b","label":"Tower B","size":155},{"id":"c","label":"Tower C","size":117}],"hint":"Leave out Tower B first. Then compare the heights of the two remaining towers.","explain":"A and C are shorter than B. C is the taller of those two, so it is the tallest tower the ladder can reach."},{"prompt":"The smallest chest is too small. The biggest chest is too heavy. Choose a chest that is not the smallest and not the biggest.","answer":"a","full":"Chest A is bigger than Chest B but smaller than Chest C.","objectType":"chest","objects":[{"id":"a","label":"Chest A","size":113},{"id":"b","label":"Chest B","size":76},{"id":"c","label":"Chest C","size":150}],"hint":"Cross out the smallest and biggest chests. Only the middle-sized chest remains.","explain":"Chest A is the middle size. It avoids both problems because it is not the smallest or the biggest."}]}],"rules":[["shop","Café quantities","many apples · much juice · there are bottles","Use many for things you can count and much for an uncountable amount. Match is or are to the noun you describe. Also adds another fact.","There are many apples, but there isn't much juice. He also enjoys sandwiches."],["bridge","Pronouns and links","him / her / them · and / or / but / so / because","Object pronouns receive an action. And adds, or gives a choice, but contrasts, so gives a result and because gives a reason.","Aisha is lost. Ben gives her a map because she needs help."],["train","Questions and frequency","How often does ...? · What time does ...?","Ask about frequency with How often and a time with What time. Use a base verb after does. Frequency words usually come before a main verb and after be.","How often does Nora check her compass? We are always ready."],["boat","Instructions in order","First, ... Next, ... Finally, ... · Do not + base verb","Start an instruction with a base verb. Use Do not for a negative instruction. Sequencing words make the steps clear.","First, check your map. Next, follow the path. Do not run on the bridge."],["pickaxe","Past and now","built · went · did not find · Did she bring ...?","Use past simple for finished events. After did or did not, use a base verb. For an action happening now, use am, is or are plus an ing verb.","Yesterday, we explored the mine. Now, we are resting."],["portal","Future messages","will / won't + base verb · be going to + base verb","Use will for predictions and promises. Won't means will not. Going to describes a plan. Match am, is or are to the subject.","I will help you tomorrow. She is going to plant seeds."],["cat","Skills and permission","can / can't + base verb · Can we ...? · enjoy + verb-ing","Can describes an ability or asks permission. Can't can show inability or refuse permission. Keep the next verb in its base form. Use an ing verb after enjoy.","Can we open the chest? He enjoys swimming."],["castle","Comparison clues","taller than · smaller than · the tallest · the smallest","Comparatives compare things. Superlatives identify an extreme in a group. When there are two clues, your choice must satisfy both of them.","Tower B is taller than Tower A but shorter than Tower C."]],"curriculum":{"document":"KSSR (Semakan 2017) Standards-Based English Language Curriculum, Sekolah Kebangsaan, Year 5; Bahagian Pembangunan Kurikulum, Ministry of Education Malaysia, November 2020","title":"Year 5 DSKP grammar practice","url":"https://www.teacherfiera.com/wp-content/uploads/2020/04/DSKP-ENGLISH-YEAR-5-SK-30-12-2020-Latest.pdf","grammarPages":"Printed syllabus pages 45–46; PDF pages 59–60","learningStandards":[{"code":"2.1.3 / 4.2.2","focus":"Language for asking for and giving simple advice."},{"code":"2.1.4","focus":"Language for questions and descriptions about future plans."},{"code":"2.1.5 / 4.2.4","focus":"Suitable statements describing people, places and things."},{"code":"2.2.1","focus":"Suitable questions for short exchanges."},{"code":"4.2.3","focus":"Language for recounting real events and experiences."},{"code":"4.2.5","focus":"Links between ideas using coordinating conjunctions and reference pronouns."},{"code":"4.3.3","focus":"Checking and improving a draft after feedback."}],"note":"Original contextual grammar activities for a higher-ability class, within the Year 5 syllabus and its stated review of earlier grammar. These short practice tasks support selected language skills; game scores are not a complete assessment of the DSKP learning standards or a PBD performance level."}},"y6-supported":{"year":6,"levelLabel":"Step by step","missions":[{"id":"market","title":"Village Market","topic":"am · is · are · have · has","type":"rune","color":"#ffbd64","icon":"shop","x":18,"y":72,"guide":"Tap the correct word block. Help the villagers open their shops!","taskLabel":"Shop opened","tasks":[{"prompt":"I ___ happy.","options":["am","is","are"],"answer":"am","full":"I am happy.","hint":"Use am with I. Use is with he, she or it. Use are with you, we or they.","explain":"I am happy. Use am after I.","scene":"boy","dskpTopic":"Recycled Years 1–5 be and have foundations; Year 6 syllabus sections 9–10 permit earlier grammar review","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"She ___ a teacher.","options":["are","is","am"],"answer":"is","full":"She is a teacher.","hint":"She is one person. Use is with she.","explain":"She is a teacher. Use is after she.","scene":"girl","dskpTopic":"Recycled Years 1–5 be and have foundations; Year 6 syllabus sections 9–10 permit earlier grammar review","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"They ___ my friends.","options":["is","am","are"],"answer":"are","full":"They are my friends.","hint":"Use are with they.","explain":"They are my friends. Use are after they.","scene":"friends","dskpTopic":"Recycled Years 1–5 be and have foundations; Year 6 syllabus sections 9–10 permit earlier grammar review","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"He ___ a red bag.","options":["have","has"],"answer":"has","full":"He has a red bag.","hint":"Use has with he, she or it. Use have with I, you, we or they.","explain":"He has a red bag. Use has after he.","scene":"boy","dskpTopic":"Recycled Years 1–5 be and have foundations; Year 6 syllabus sections 9–10 permit earlier grammar review","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"We ___ two books.","options":["has","have"],"answer":"have","full":"We have two books.","hint":"Use have with we.","explain":"We have two books. Use have after we.","scene":"friends","dskpTopic":"Recycled Years 1–5 be and have foundations; Year 6 syllabus sections 9–10 permit earlier grammar review","learningStandard":"4.2.1 (preparatory language support)"}],"subtitle":"Help the village"},{"id":"bridge","title":"Pronoun Bridge","topic":"he · she · they · his · her","type":"bridge","color":"#80d4ea","icon":"bridge","x":38,"y":56,"guide":"Tap the correct pronoun block to build the bridge. Help your friends cross!","taskLabel":"Bridge block added","tasks":[{"prompt":"Ali is a boy. ___ is kind.","options":["He","She","They"],"answer":"He","full":"Ali is a boy. He is kind.","hint":"Use he for one boy.","explain":"He takes the place of Ali, a boy.","scene":"boy","dskpTopic":"Recycled subject pronouns and possessive adjectives; Year 6 syllabus sections 9–10 and Appendix 1","learningStandard":"4.2.1 / 4.2.5 (preparatory language support)"},{"prompt":"Sara is a girl. ___ is reading.","options":["He","She","They"],"answer":"She","full":"Sara is a girl. She is reading.","hint":"Use she for one girl.","explain":"She takes the place of Sara, a girl.","scene":"girl","dskpTopic":"Recycled subject pronouns and possessive adjectives; Year 6 syllabus sections 9–10 and Appendix 1","learningStandard":"4.2.1 / 4.2.5 (preparatory language support)"},{"prompt":"Ali and Sara are friends. ___ play together.","options":["He","She","They"],"answer":"They","full":"Ali and Sara are friends. They play together.","hint":"Use they for two or more people.","explain":"Use They for Ali and Sara. There are two people.","scene":"friends","dskpTopic":"Recycled subject pronouns and possessive adjectives; Year 6 syllabus sections 9–10 and Appendix 1","learningStandard":"4.2.1 / 4.2.5 (preparatory language support)"},{"prompt":"This bag belongs to Ali. It is ___ bag.","options":["his","her","their"],"answer":"his","full":"This bag belongs to Ali. It is his bag.","hint":"The bag belongs to Ali. Use his before bag.","explain":"His bag means the bag belongs to Ali.","scene":"boy","dskpTopic":"Recycled subject pronouns and possessive adjectives; Year 6 syllabus sections 9–10 and Appendix 1","learningStandard":"4.2.1 / 4.2.5 (preparatory language support)"},{"prompt":"This book belongs to Sara. It is ___ book.","options":["his","her","their"],"answer":"her","full":"This book belongs to Sara. It is her book.","hint":"The book belongs to Sara. Use her before book.","explain":"Her book means the book belongs to Sara.","scene":"girl","dskpTopic":"Recycled subject pronouns and possessive adjectives; Year 6 syllabus sections 9–10 and Appendix 1","learningStandard":"4.2.1 / 4.2.5 (preparatory language support)"}],"subtitle":"Help your friends cross"},{"id":"train","title":"Word Train","topic":"Simple Present","type":"train","color":"#a8d884","icon":"train","x":17,"y":34,"guide":"Tap the word carriages in order. Build a sentence to move the train!","taskLabel":"Train journey completed","tasks":[{"prompt":"Talk about playing football every day. Start with I.","words":["I","play","football","every","day."],"answer":"I play football every day.","full":"I play football every day.","hint":"Start with I. Put play next. Finish with every day.","explain":"I play football every day. Every day tells us this is a routine.","scene":"ball","dskpTopic":"Recycled present simple for routines; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"Talk about her trip to school. Start with She.","words":["She","walks","to","school."],"answer":"She walks to school.","full":"She walks to school.","hint":"Start with She. For a routine, use walks after she.","explain":"She walks to school. Add s to walk after she.","scene":"girl","dskpTopic":"Recycled present simple for routines; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"Talk about eating rice every day. Start with They.","words":["They","eat","rice","every","day."],"answer":"They eat rice every day.","full":"They eat rice every day.","hint":"Start with They. Put eat next. Finish with every day.","explain":"They eat rice every day. Use eat after they.","scene":"friends","dskpTopic":"Recycled present simple for routines; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"Talk about the fruit he likes. Start with He.","words":["He","likes","apples."],"answer":"He likes apples.","full":"He likes apples.","hint":"Start with He. Put likes next.","explain":"He likes apples. Add s to like after he.","scene":"boy","dskpTopic":"Recycled present simple for routines; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"Talk about going to school on Mondays. Start with We.","words":["We","go","to","school","on","Mondays."],"answer":"We go to school on Mondays.","full":"We go to school on Mondays.","hint":"Start with We go. Finish with on Mondays.","explain":"We go to school on Mondays. Use go after we.","scene":"friends","dskpTopic":"Recycled present simple for routines; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"}],"subtitle":"Build your daily routine"},{"id":"river","title":"Action River","topic":"Present Continuous","type":"build","color":"#69c8e8","icon":"boat","x":56,"y":74,"guide":"Put the word blocks in order to build a boat. These actions are happening now!","taskLabel":"Boat launched","tasks":[{"prompt":"The boy is running now. Build the sentence. Start with He.","words":["He","is","running."],"answer":"He is running.","full":"He is running.","hint":"Start with He is. Then add running.","explain":"He is running. Use is + running for an action happening now.","scene":"boy","dskpTopic":"Recycled present continuous; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"The girl is reading now. Build the sentence. Start with She.","words":["She","is","reading","a","book."],"answer":"She is reading a book.","full":"She is reading a book.","hint":"Start with She is. Put reading next.","explain":"She is reading a book. Use is + reading after she.","scene":"girl","dskpTopic":"Recycled present continuous; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"Your friends are playing now. Build the sentence. Start with They.","words":["They","are","playing","football."],"answer":"They are playing football.","full":"They are playing football.","hint":"Start with They are. Put playing next.","explain":"They are playing football. Use are + playing after they.","scene":"ball","dskpTopic":"Recycled present continuous; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"You are eating an apple now. Build the sentence. Start with I.","words":["I","am","eating","an","apple."],"answer":"I am eating an apple.","full":"I am eating an apple.","hint":"Start with I am. Put eating next.","explain":"I am eating an apple. Use am + eating after I.","scene":"apple","dskpTopic":"Recycled present continuous; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"},{"prompt":"You and your friends are watching TV now. Start with We.","words":["We","are","watching","TV."],"answer":"We are watching TV.","full":"We are watching TV.","hint":"Start with We are. Put watching next.","explain":"We are watching TV. Use are + watching after we.","scene":"friends","dskpTopic":"Recycled present continuous; Year 4 routine-versus-current-action function in Year 6 Appendix 1","learningStandard":"4.2.1 (preparatory language support)"}],"subtitle":"Build actions happening now"},{"id":"mine","title":"Yesterday Mine","topic":"Simple Past","type":"mine","color":"#acbcdf","icon":"pickaxe","x":68,"y":51,"guide":"Mine the correct past-tense word block. Each correct answer gives you a gem!","taskLabel":"Gem found","tasks":[{"prompt":"Yesterday, I ___ football.","options":["play","played","playing"],"answer":"played","full":"Yesterday, I played football.","hint":"Yesterday is in the past. Play becomes played.","explain":"Played is the past form of play.","scene":"ball","dskpTopic":"Recycled past simple, regular and irregular; Year 4 grammar in Year 6 Appendix 1","learningStandard":"4.2.3 (preparatory language support)"},{"prompt":"Last night, she ___ TV.","options":["watch","watches","watched"],"answer":"watched","full":"Last night, she watched TV.","hint":"Last night is in the past. Watch becomes watched.","explain":"Watched tells us the action happened last night.","scene":"girl","dskpTopic":"Recycled past simple, regular and irregular; Year 4 grammar in Year 6 Appendix 1","learningStandard":"4.2.3 (preparatory language support)"},{"prompt":"Yesterday, he ___ to school.","options":["go","went","goes"],"answer":"went","full":"Yesterday, he went to school.","hint":"Yesterday is in the past. Go becomes went.","explain":"Went is the past form of go.","scene":"boy","dskpTopic":"Recycled past simple, regular and irregular; Year 4 grammar in Year 6 Appendix 1","learningStandard":"4.2.3 (preparatory language support)"},{"prompt":"Yesterday, we ___ rice.","options":["eat","ate","eating"],"answer":"ate","full":"Yesterday, we ate rice.","hint":"Yesterday is in the past. Eat becomes ate.","explain":"Ate is the past form of eat.","scene":"friends","dskpTopic":"Recycled past simple, regular and irregular; Year 4 grammar in Year 6 Appendix 1","learningStandard":"4.2.3 (preparatory language support)"},{"prompt":"Last Sunday, they ___ their grandma.","options":["visit","visited","visits"],"answer":"visited","full":"Last Sunday, they visited their grandma.","hint":"Last Sunday is in the past. Add ed to visit.","explain":"Visited tells us the visit happened in the past.","scene":"friends","dskpTopic":"Recycled past simple, regular and irregular; Year 4 grammar in Year 6 Appendix 1","learningStandard":"4.2.3 (preparatory language support)"}],"subtitle":"Find words from the past"},{"id":"portal","title":"Tomorrow Portal","topic":"will · going to","type":"portal","color":"#bea1fa","icon":"portal","x":80,"y":27,"guide":"Tap the correct word to open the portal. Help your explorer travel to tomorrow!","taskLabel":"Portal opened","tasks":[{"prompt":"Tomorrow, I ___ help my mum.","options":["will","was","did"],"answer":"will","full":"Tomorrow, I will help my mum.","hint":"Tomorrow is in the future. Use will before help.","explain":"Will help tells us about an action in the future.","scene":"boy","dskpTopic":"Year 6 future forms: will and going to; also recycled Year 4–5 grammar","learningStandard":"4.2.2 (preparatory language support)"},{"prompt":"Next week, she will ___ her grandma.","options":["visits","visit","visited"],"answer":"visit","full":"Next week, she will visit her grandma.","hint":"After will, use the base form of the verb: visit.","explain":"Use visit after will. This action will happen next week.","scene":"girl","dskpTopic":"Year 6 future forms: will and going to; also recycled Year 4–5 grammar","learningStandard":"4.2.2 (preparatory language support)"},{"prompt":"I ___ going to read a book tonight.","options":["is","are","am"],"answer":"am","full":"I am going to read a book tonight.","hint":"Use I + am + going to + a verb.","explain":"I am going to read a book tonight. This is a plan for tonight.","scene":"boy","dskpTopic":"Year 6 future forms: will and going to; also recycled Year 4–5 grammar","learningStandard":"4.2.2 (preparatory language support)"},{"prompt":"They are going to ___ football tomorrow.","options":["played","play","plays"],"answer":"play","full":"They are going to play football tomorrow.","hint":"After going to, use the base form of the verb: play.","explain":"Going to play tells us about a plan for tomorrow.","scene":"ball","dskpTopic":"Year 6 future forms: will and going to; also recycled Year 4–5 grammar","learningStandard":"4.2.2 (preparatory language support)"},{"prompt":"We ___ going to visit the zoo tomorrow.","options":["am","is","are"],"answer":"are","full":"We are going to visit the zoo tomorrow.","hint":"Use are with we.","explain":"We are going to visit the zoo tomorrow. Use are after we.","scene":"friends","dskpTopic":"Year 6 future forms: will and going to; also recycled Year 4–5 grammar","learningStandard":"4.2.2 (preparatory language support)"}],"subtitle":"Travel to tomorrow"},{"id":"rescue","title":"Animal Rescue","topic":"in · on · under · behind · between","type":"place","color":"#ff9c95","icon":"cat","x":42,"y":22,"guide":"Tap the cat, then tap the correct place. You can also drag the cat to its place!","taskLabel":"Cat rescued","tasks":[{"prompt":"The cat is in the box.","answer":"in","full":"The cat is in the box.","hint":"In means inside. Find the inside of the box.","explain":"In the box means inside the box.","dskpTopic":"Recycled location and position; Year 6 language function 8 and earlier primary prepositions","learningStandard":"3.2.2 (preparatory language support)"},{"prompt":"The cat is on the table.","answer":"on","full":"The cat is on the table.","hint":"On means on top. Find the top of the table.","explain":"On the table means on top of the table.","dskpTopic":"Recycled location and position; Year 6 language function 8 and earlier primary prepositions","learningStandard":"3.2.2 (preparatory language support)"},{"prompt":"The cat is under the table.","answer":"under","full":"The cat is under the table.","hint":"Under means below. Find the space below the table.","explain":"Under the table means below the table.","dskpTopic":"Recycled location and position; Year 6 language function 8 and earlier primary prepositions","learningStandard":"3.2.2 (preparatory language support)"},{"prompt":"The cat is behind the tree.","answer":"behind","full":"The cat is behind the tree.","hint":"Behind means at the back. Find the space behind the tree.","explain":"Behind the tree means at the back of the tree.","dskpTopic":"Recycled location and position; Year 6 language function 8 and earlier primary prepositions","learningStandard":"3.2.2 (preparatory language support)"},{"prompt":"The cat is between the rocks.","answer":"between","full":"The cat is between the rocks.","hint":"Between means in the middle of two things. Find the space between the two rocks.","explain":"Between the rocks means in the space between the two rocks.","dskpTopic":"Recycled location and position; Year 6 language function 8 and earlier primary prepositions","learningStandard":"3.2.2 (preparatory language support)"}],"subtitle":"Find a safe place for the cat"},{"id":"castle","title":"Giant Castle","topic":"Comparative & Superlative","type":"compare","color":"#e5b3f0","icon":"castle","x":89,"y":73,"guide":"Tap the building or chest that matches the instruction. Light up the castle!","taskLabel":"Castle light switched on","tasks":[{"prompt":"Choose the taller tower.","answer":"tall","objects":[{"id":"short","label":"Tower A","size":80},{"id":"tall","label":"Tower B","size":140}],"hint":"A taller tower is higher than the other tower. Compare the two towers.","explain":"Tower B is taller than Tower A. Taller compares two things.","dskpTopic":"Recycled comparative and superlative adjectives; Years 4–5 grammar in Year 6 Appendix 1","learningStandard":"3.2.2 (preparatory language support)","full":"Tower B is taller than Tower A."},{"prompt":"Choose the tallest tower.","answer":"tallest","objects":[{"id":"small","label":"Tower A","size":70},{"id":"medium","label":"Tower B","size":110},{"id":"tallest","label":"Tower C","size":158}],"hint":"The tallest tower is higher than all the other towers.","explain":"Tower C is the tallest of the three towers.","dskpTopic":"Recycled comparative and superlative adjectives; Years 4–5 grammar in Year 6 Appendix 1","learningStandard":"3.2.2 (preparatory language support)","full":"Tower C is the tallest of the three towers."},{"prompt":"Choose the smaller chest.","answer":"smaller","objects":[{"id":"bigger","label":"Chest A","size":128},{"id":"smaller","label":"Chest B","size":75}],"objectType":"chest","hint":"Look at the two chests. Choose the smaller one. It is less big.","explain":"Chest B is smaller than Chest A.","dskpTopic":"Recycled comparative and superlative adjectives; Years 4–5 grammar in Year 6 Appendix 1","learningStandard":"3.2.2 (preparatory language support)","full":"Chest B is smaller than Chest A."},{"prompt":"Choose the biggest chest.","answer":"biggest","objects":[{"id":"small","label":"Chest A","size":68},{"id":"biggest","label":"Chest B","size":140},{"id":"medium","label":"Chest C","size":100}],"objectType":"chest","hint":"Look at all three chests. Choose the largest one.","explain":"Chest B is the biggest of the three chests.","dskpTopic":"Recycled comparative and superlative adjectives; Years 4–5 grammar in Year 6 Appendix 1","learningStandard":"3.2.2 (preparatory language support)","full":"Chest B is the biggest of the three chests."},{"prompt":"Choose the shortest tower.","answer":"shortest","objects":[{"id":"tall","label":"Tower A","size":145},{"id":"shortest","label":"Tower B","size":70},{"id":"medium","label":"Tower C","size":108}],"hint":"Look at all three towers. Choose the lowest one.","explain":"Tower B is the shortest of the three towers.","dskpTopic":"Recycled comparative and superlative adjectives; Years 4–5 grammar in Year 6 Appendix 1","learningStandard":"3.2.2 (preparatory language support)","full":"Tower B is the shortest of the three towers."}],"subtitle":"Light up the castle"}],"rules":[["shop","Am / is / are","I am · He / she / it is · You / we / they are","Choose am, is or are to match the person or people in the sentence.","I am happy. She is a teacher."],["shop","Have / has","I / you / we / they have · He / she / it has","Have and has tell us what someone owns.","We have books. He has a bag."],["bridge","Pronouns","He = a boy · She = a girl · They = two or more people","Use his for something a boy owns. Use her for something a girl owns.","Ali is kind. He is kind. It is her book."],["train","Simple Present","I play · She plays · They play","Use it for routines. Many verbs take s or es after he, she or it.","She walks to school every day."],["boat","Present Continuous","am / is / are + verb-ing","Use it for actions happening now.","They are playing football."],["pickaxe","Simple Past","play → played · go → went · eat → ate","Use it for actions in the past. Many verbs take ed. Some verbs have a special past form.","Yesterday, I went to school."],["portal","Future","will + verb · am / is / are going to + verb","Use it for the future. After will or going to, use the base form of the verb.","She will visit grandma. We are going to play."],["cat","Prepositions","in · on · under · behind · between","Inside · on top · below · at the back · in the middle of two things.","The cat is under the table."],["castle","Comparisons","tall → taller → tallest","Use taller to compare two things. The tallest is higher than all the other things.","Tower B is taller. Tower C is the tallest."]],"curriculum":{"document":"KSSR (Semakan 2017) Standards-Based English Language Curriculum, Sekolah Kebangsaan, Year 6; Bahagian Pembangunan Kurikulum, Ministry of Education Malaysia, January 2022","title":"Year 6 supported primary grammar revision · 6B","url":"https://www.teacherfiera.com/wp-content/uploads/2020/04/2.-DSKP-KSSR-Semakan-2017-Bahasa-Inggeris-Tahun-6-SK_ISBN.pdf","grammarPages":"Printed syllabus pages 44–46; PDF pages 58–60. Earlier grammar: printed pages 52–53; PDF pages 66–67.","learningStandards":[{"code":"4.2.1","focus":"Foundational language for giving information about people."},{"code":"4.2.2","focus":"Foundational language for future plans and events."},{"code":"4.2.3","focus":"Foundational language for recounting events."},{"code":"4.2.5","focus":"Prerequisite pronouns for linking ideas."},{"code":"3.2.2","focus":"Prerequisite understanding of position and comparison instructions."}],"note":"Audited against the January 2022 KPM/BPK Year 6 SK DSKP. Retained as supported revision for a lower to lower-middle ability Year 6 class: sections 9–10 permit teachers to revisit Years 1–5 grammar, and Appendix 1 confirms the upper-primary foundations. This pack is prerequisite practice, not complete coverage of new Year 6 grammar or full learning standards. Original mission IDs, task order, prompts, answers, options and object definitions are unchanged so existing pupil progress remains valid. The five comparison tasks only gained missing full-sentence feedback. Game scores are not PBD performance levels.","topicAudit":[{"missionId":"market","status":"permitted revision","topic":"Recycled Years 1–5 be and have foundations; Year 6 syllabus sections 9–10 permit earlier grammar review"},{"missionId":"bridge","status":"permitted revision","topic":"Recycled subject pronouns and possessive adjectives; Year 6 syllabus sections 9–10 and Appendix 1"},{"missionId":"train","status":"permitted revision","topic":"Recycled present simple for routines; Year 4 routine-versus-current-action function in Year 6 Appendix 1"},{"missionId":"river","status":"permitted revision","topic":"Recycled present continuous; Year 4 routine-versus-current-action function in Year 6 Appendix 1"},{"missionId":"mine","status":"permitted revision","topic":"Recycled past simple, regular and irregular; Year 4 grammar in Year 6 Appendix 1"},{"missionId":"portal","status":"permitted revision","topic":"Year 6 future forms: will and going to; also recycled Year 4–5 grammar"},{"missionId":"rescue","status":"permitted revision","topic":"Recycled location and position; Year 6 language function 8 and earlier primary prepositions"},{"missionId":"castle","status":"permitted revision","topic":"Recycled comparative and superlative adjectives; Years 4–5 grammar in Year 6 Appendix 1"}],"kbatCount":0}},"y6-high":{"year":6,"levelLabel":"Challenge","missions":[{"id":"y6h-market","title":"Eco Market","subtitle":"Read the clues and help the shops","topic":"Passive voice · enough · comparisons","type":"rune","icon":"shop","color":"#ffbd64","x":18,"y":72,"guide":"Read every clue. Choose the message that is accurate and useful.","taskLabel":"Shop helped","reminder":"Remember: A passive sentence focuses on the thing receiving an action. Enough means the amount meets a need.","tasks":[{"prompt":"Every morning, workers wash the glass bottles. Choose the correct passive sentence about the bottles.","options":["The glass bottles are washed every morning.","The glass bottles is washed every morning.","The glass bottles are wash every morning."],"answer":"The glass bottles are washed every morning.","full":"The glass bottles are washed every morning.","hint":"Bottles is plural. Use are followed by the past participle washed.","explain":"Are washed focuses on the bottles that receive the action. Use are with a plural noun and washed after are.","scene":"friends","dskpTopic":"Year 6 passive voice","learningStandard":"3.2.2 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"Workers make bags from old shirts and notebooks from old paper. A notice swaps the two materials. Which edit corrects both product-and-material relationships?","options":["The bags are made from old paper, and the notebooks are made from old shirts.","The bags are made from old shirts, and the notebooks are made from old paper.","The bags are made from old shirts, and the notebooks are made from old shirts."],"answer":"The bags are made from old shirts, and the notebooks are made from old paper.","full":"The bags are made from old shirts, and the notebooks are made from old paper.","hint":"Check each finished product separately. Bags use shirts; notebooks use paper. Both parts of the edit must be correct.","explain":"The edit restores both relationships: shirts become bags, and paper becomes notebooks. Are made from focuses on each product and names its material.","scene":"friends","dskpTopic":"Year 6 passive voice","learningStandard":"3.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil separates two material-to-product relationships, detects the swapped references and selects an edit that restores both; every option uses the same correct passive form."},{"prompt":"A pie needs at least five apples. Box A has three, Box B has five and Box C has eight. Choose the smallest amount that is enough, without taking extra apples.","options":["Choose Box C because it has more apples than Box B.","Choose Box A because it has fewer apples than Box B.","Choose Box B because it has enough apples without any extra."],"answer":"Choose Box B because it has enough apples without any extra.","full":"Choose Box B because it has enough apples without any extra.","hint":"Check both conditions: at least five apples, and no extra apples.","explain":"A has too few apples. C has enough but includes three extra. B meets both conditions with exactly five apples.","scene":"apple","dskpTopic":"Year 6 comparisons with too and not enough; recycled comparisons","learningStandard":"2.1.3 / 3.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"evaluate","kbatRationale":"The pupil evaluates three choices against a minimum quantity and a no-waste condition, then selects the reasoned recommendation; the grammar is correct in every option."},{"prompt":"Seven visitors each need one cup. Tray A has eight cups and Tray B has six. Which note explains why the shop should use Tray A?","options":["Tray B does not have enough cups, but Tray A does.","Both trays have enough cups for all seven visitors.","Tray A does not have enough cups, but Tray B does."],"answer":"Tray B does not have enough cups, but Tray A does.","full":"Tray B does not have enough cups, but Tray A does.","hint":"Compare each tray with seven visitors. Your note must describe both trays accurately.","explain":"Six cups are not enough for seven people, while eight cups are enough. The contrast supports using Tray A.","scene":"friends","dskpTopic":"Year 6 comparisons with not enough; recycled conjunctions","learningStandard":"2.1.3 / 3.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil relates two quantities to a shared need and tests both parts of a contrasting statement; recalling the phrase enough cups does not identify the correct note."},{"prompt":"A paper bag becomes weak in the rain. A plastic bag stays strong when wet. It is raining now. Which packing note uses the evidence to protect the shopping?","options":["The shopping is packed in the paper bag because it stays strong when wet.","The shopping is packed in the plastic bag because it stays strong when wet.","The shopping is packed in the paper bag because there is no rain."],"answer":"The shopping is packed in the plastic bag because it stays strong when wet.","full":"The shopping is packed in the plastic bag because it stays strong when wet.","hint":"Match the bag material to the weather and check the reason after because.","explain":"The plastic bag stays strong in the given wet conditions. The passive note describes a choice supported by the material and weather clues.","scene":"friends","dskpTopic":"Year 6 passive voice; recycled conjunction because","learningStandard":"2.1.3 / 3.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"evaluate","kbatRationale":"The pupil evaluates a practical choice using material properties and current weather, rejecting notes with an unsupported reason despite their grammatical form."}]},{"id":"y6h-bridge","title":"Message Bridge","subtitle":"Keep people and messages clear","topic":"Reported speech · question tags · reference pronouns","type":"bridge","icon":"bridge","color":"#80d4ea","x":38,"y":56,"guide":"Choose a message that keeps the facts, speakers and grammar correct.","taskLabel":"Message delivered","reminder":"Remember: Check who is speaking and who each pronoun means. A question tag checks a statement: can't ... , can ...?","tasks":[{"prompt":"Complete the question that checks this positive statement: You carry a map, ___?","options":["don't you","do you","isn't you"],"answer":"don't you","full":"You carry a map, don't you?","hint":"A positive present simple statement takes a negative tag with do.","explain":"Carry is a present simple verb. The positive statement You carry a map takes the negative question tag don't you.","scene":"friends","dskpTopic":"Year 6 question tags","learningStandard":"2.2.1 (supporting language practice)","kbat":false,"cognitiveLevel":"remember"},{"prompt":"Sara said, \"I am ready.\" Report her words later, changing am to its past form.","options":["Sara said she were ready.","Sara said she was ready.","Sara said she be ready."],"answer":"Sara said she was ready.","full":"Sara said she was ready.","hint":"I becomes she when you report Sara's words. The past form of am with she is was.","explain":"The report uses she for Sara and was as the past form of am. This task practises the requested past-form report.","scene":"girl","dskpTopic":"Year 6 reported speech","learningStandard":"2.3.1 / 4.2.3 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"Ali told Sara, \"I have your map.\" Later, Sara tells Mina who had her map. Which is Sara's accurate report, using the past form had?","options":["Ali said Sara had his map.","Sara said she had Ali's map.","Ali said he had my map."],"answer":"Ali said he had my map.","full":"Ali said he had my map.","hint":"Ali spoke first, so he refers to Ali. Sara is now speaking, so her own map is my map.","explain":"Ali is the original speaker and map holder. In Sara's report, he refers to Ali and my refers to Sara, the map owner.","scene":"friends","dskpTopic":"Year 6 reported speech; recycled reference pronouns","learningStandard":"2.3.1 / 4.2.3 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil tracks the original speaker, current speaker and owner through a change of viewpoint; every option uses had, so tense recall alone is insufficient."},{"prompt":"Mina and her brother borrowed a boat together. Only her brother returned it. Mina's draft says, \"We borrowed the boat and we returned it.\" Which edit fixes who did the second action?","options":["We borrowed the boat, but he returned it.","He borrowed the boat, but we returned it.","We borrowed the boat, but she returned it."],"answer":"We borrowed the boat, but he returned it.","full":"We borrowed the boat, but he returned it.","hint":"We includes Mina and her brother. The second action was done by only one person: her brother.","explain":"We correctly describes the two borrowers. He identifies the brother as the only person who returned the boat, and it refers to the boat.","scene":"girl","dskpTopic":"Recycled reference pronouns and conjunctions","learningStandard":"4.2.5 / 4.3.3 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil compares a draft against two different sets of actors, locates the inaccurate reference and chooses an edit that preserves both events."},{"prompt":"The keeper says, \"Visitors can enter only before six.\" It is now six thirty. Which checking question follows the rule and uses the correct question tag?","options":["We can enter now, can't we?","We can't enter now, can we?","We can enter until seven, can't we?"],"answer":"We can't enter now, can we?","full":"We can't enter now, can we?","hint":"First decide whether entry is allowed at six thirty. Then use a positive tag after the negative statement.","explain":"Six thirty is after the entry deadline, so We can't enter now follows the rule. The negative statement takes the positive tag can we.","scene":"friends","dskpTopic":"Year 6 question tags; recycled can for permission","learningStandard":"2.1.2 / 2.2.1 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil applies a time restriction to the present situation, derives the permission statement and checks tag polarity; all three offered questions have grammatical tags."}]},{"id":"y6h-train","title":"Experience Train","subtitle":"Build questions about experience and time","topic":"Present perfect · ever · for · since · How long?","type":"train","icon":"train","color":"#a8d884","x":17,"y":34,"guide":"Put the carriages in order. Check have or has and the past participle.","taskLabel":"Train journey completed","reminder":"Remember: Use have or has with a past participle. For gives a length of time; since gives the starting point.","tasks":[{"prompt":"Ask whether your friend has visited Sabah at any time before now. Start with Have and end with Sabah?","words":["Have","you","ever","visited","Sabah?"],"answer":"Have you ever visited Sabah?","full":"Have you ever visited Sabah?","hint":"Put Have before you. Ever comes before the past participle visited.","explain":"Have you ever visited asks about an experience at any time up to now, without naming a finished past date.","scene":"friends","dskpTopic":"Year 6 present perfect with ever","learningStandard":"2.1.1 / 4.2.1 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"Hana began living here in 2022 and still lives here. Build a sentence with since. Start with Hana and end with 2022.","words":["Hana","has","lived","here","since","2022."],"answer":"Hana has lived here since 2022.","full":"Hana has lived here since 2022.","hint":"Use has with Hana. Since introduces the starting year.","explain":"Has lived connects Hana's past starting point with the present. Since 2022 gives the starting point.","scene":"girl","dskpTopic":"Year 6 present perfect with since","learningStandard":"2.1.1 / 4.2.1 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"Build a sentence saying that we began living here three years ago and still live here. Use for. Start with We and end with years.","words":["We","have","lived","here","for","three","years."],"answer":"We have lived here for three years.","full":"We have lived here for three years.","hint":"Use have with we. For introduces the length of time: three years.","explain":"Have lived describes a situation that continues now. For three years tells us its duration.","scene":"friends","dskpTopic":"Year 6 present perfect with for","learningStandard":"2.1.1 / 4.2.1 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"Ask about the length of Amin's stay at the camp, which is still continuing. Start with How and end with camp?","words":["How","long","has","Amin","stayed","at","the","camp?"],"answer":"How long has Amin stayed at the camp?","full":"How long has Amin stayed at the camp?","hint":"Start with How long. Put has before Amin, then use the past participle stayed.","explain":"How long asks for a duration. Has Amin stayed uses present perfect for a stay that continues now.","scene":"boy","dskpTopic":"Year 6 present perfect with How long","learningStandard":"2.1.1 / 4.2.1 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"Ask whether he has eaten dragon fruit at any time before now. Start with Has and end with fruit?","words":["Has","he","ever","eaten","dragon","fruit?"],"answer":"Has he ever eaten dragon fruit?","full":"Has he ever eaten dragon fruit?","hint":"Use has with he. The past participle of eat is eaten.","explain":"Has he ever eaten asks about an experience. Eaten is the past participle used after has.","scene":"apple","dskpTopic":"Year 6 present perfect with ever","learningStandard":"2.1.1 / 4.2.1 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"}]},{"id":"y6h-river","title":"River Timeline","subtitle":"Build a story about past actions","topic":"Past continuous with past simple · used to","type":"build","icon":"boat","color":"#69c8e8","x":56,"y":74,"guide":"Put the blocks in order. Show the action in progress and the event that happened.","taskLabel":"Story boat launched","reminder":"Remember: Was or were plus an ing verb shows a past action in progress. Used to describes a past habit or situation.","tasks":[{"prompt":"He began reading before the bell rang and was still reading at that moment. Start with He and end with rang.","words":["He","was","reading","when","the","bell","rang."],"answer":"He was reading when the bell rang.","full":"He was reading when the bell rang.","hint":"Use was reading for the action in progress. When introduces the shorter event.","explain":"Was reading is past continuous. The past simple rang names the event during that action.","scene":"boy","dskpTopic":"Year 6 past continuous with past simple","learningStandard":"2.3.1 / 4.2.3 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"They were on a walk when the rain began. Build the sentence. Start with They and end with rain.","words":["They","were","walking","when","it","started","to","rain."],"answer":"They were walking when it started to rain.","full":"They were walking when it started to rain.","hint":"Use were with they. Were walking is the action already in progress.","explain":"Were walking describes the continuing past action. Started describes when the rain began during the walk.","scene":"friends","dskpTopic":"Year 6 past continuous with past simple","learningStandard":"2.3.1 / 4.2.3 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"We played in this park regularly in the past, but we do not play here now. Start with We and end with here.","words":["We","used","to","play","here."],"answer":"We used to play here.","full":"We used to play here.","hint":"Use used to before the base verb play for the past habit.","explain":"Used to play describes the former routine. The prompt tells us this routine no longer continues.","scene":"friends","dskpTopic":"Year 6 used to","learningStandard":"2.3.1 / 4.2.3 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"She was a farmer before she became a teacher. Describe the former situation with used to. Start with She and end with farmer.","words":["She","used","to","be","a","farmer."],"answer":"She used to be a farmer.","full":"She used to be a farmer.","hint":"Used to is followed by a base verb. Here, use be.","explain":"Used to be describes her former situation. The prompt tells us her job has changed.","scene":"girl","dskpTopic":"Year 6 used to","learningStandard":"2.3.1 / 4.2.3 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"The cat escaped during Tom's sleep. Build the sentence with While. Start with While and end with escaped.","words":["While","Tom","was","sleeping,","the","cat","escaped."],"answer":"While Tom was sleeping, the cat escaped.","full":"While Tom was sleeping, the cat escaped.","hint":"While introduces the action in progress: Tom was sleeping. Put a comma before the main event.","explain":"Was sleeping is the background action. Escaped is the past simple event that happened during it.","scene":"friends","dskpTopic":"Year 6 past continuous with past simple","learningStandard":"2.3.1 / 4.2.3 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"}]},{"id":"y6h-mine","title":"Evidence Mine","subtitle":"Separate evidence from a guess","topic":"may · might · could · indefinite pronouns","type":"mine","icon":"pickaxe","color":"#acbcdf","x":68,"y":51,"guide":"Read the evidence. Choose a careful message that does not claim more than we know.","taskLabel":"Evidence gem found","reminder":"Remember: May, might and could can show a possibility. Nobody and nothing mean no person and no thing.","tasks":[{"prompt":"The basket is completely empty. Complete the sentence: There is ___ in the basket.","options":["nothing","someone","everything"],"answer":"nothing","full":"There is nothing in the basket.","hint":"An empty basket contains no things. Choose the pronoun that means no thing.","explain":"Nothing means no thing. It fits the information that the basket is empty.","scene":"friends","dskpTopic":"Year 6 indefinite pronouns","learningStandard":"3.2.2 (supporting language practice)","kbat":false,"cognitiveLevel":"remember"},{"prompt":"We hear a sound in the cave. It could be an animal or the wind. We have not looked inside. Which message uses the evidence carefully?","options":["An animal is definitely inside the cave.","There cannot be an animal inside the cave.","An animal may be inside the cave, but we are not sure."],"answer":"An animal may be inside the cave, but we are not sure.","full":"An animal may be inside the cave, but we are not sure.","hint":"A sound gives a possibility, but there are two possible causes. Avoid a claim of certainty.","explain":"May shows a possibility. The sound could come from an animal or the wind, so the evidence does not prove either cause.","scene":"friends","dskpTopic":"Year 6 modal verbs for speculation","learningStandard":"3.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"evaluate","kbatRationale":"The pupil compares competing explanations with incomplete evidence and selects an appropriately uncertain claim; every option is a grammatical sentence."},{"prompt":"All three bags have been checked. The key is not in any bag. The table has not been checked. Which report separates a known fact from a possibility?","options":["The key isn't in any bag, and it isn't on the table.","We can't find the key in any bag, but it might be on the table.","The key is in a bag, but it might be on the table."],"answer":"We can't find the key in any bag, but it might be on the table.","full":"We can't find the key in any bag, but it might be on the table.","hint":"The bag search is complete. The table is still unknown, so use a possibility for the table.","explain":"The first part reports the completed search. Might be on the table is only a possibility because nobody has checked the table.","scene":"friends","dskpTopic":"Year 6 modal verbs for speculation and indefinite pronouns","learningStandard":"3.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil distinguishes checked locations from an unchecked location, then tests a two-part statement for the correct degree of certainty in each part."},{"prompt":"After heavy rain, the hut floor is wet and its window is open. Which possible explanation is supported by both clues?","options":["The floor might be wet because sunshine came through the window.","The floor might be wet because the window was closed throughout the rain.","The floor might be wet because rain came through the open window."],"answer":"The floor might be wet because rain came through the open window.","full":"The floor might be wet because rain came through the open window.","hint":"Connect the wet weather to the open window. Use might because the clues support an explanation without proving it.","explain":"Rain and an open window together support this possible cause of the wet floor. Might keeps the explanation cautious.","scene":"friends","dskpTopic":"Year 6 modal verbs for speculation; recycled because and past simple","learningStandard":"3.2.2 / 2.1.3 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil connects weather, an opening and a wet floor to infer a plausible cause, while retaining uncertainty; all options contain the same correct modal form."},{"prompt":"Four children enter the mine. Only Nora and Amir carry lamps. Siti and Jun have none. No child has a map. Which edit fixes this draft: \"Everyone has a lamp, and someone has a map\"?","options":["Everyone has a lamp, but nobody has a map.","Some children have lamps, and someone has a map.","Some children have lamps, but nobody has a map."],"answer":"Some children have lamps, but nobody has a ma
