@keyframes current-surge{to{stroke-dashoffset:-224}}

lain":"His ball is the ball that belongs to Dan.","scene":"ball"},{"prompt":"This doll belongs to May. It is ___ doll.","options":["his","her"],"answer":"her","full":"It is her doll.","hint":"May is a girl. Her doll belongs to May.","explain":"Her doll is the doll that belongs to May.","scene":"girl"},{"prompt":"Ben is a boy. ___ is six.","options":["He","She"],"answer":"He","full":"He is six.","hint":"Ben is a boy. Use He.","explain":"He takes the place of Ben.","scene":"boy"},{"prompt":"Hana is a girl. ___ is seven.","options":["He","She"],"answer":"She","full":"She is seven.","hint":"Hana is a girl. Use She.","explain":"She takes the place of Hana.","scene":"girl"},{"prompt":"May has a kite. ___ favourite toy is her kite.","options":["His","Her"],"answer":"Her","full":"Her favourite toy is her kite.","hint":"The kite belongs to May. Use Her.","explain":"Her favourite toy is her kite. We are talking about May.","scene":"girl"}]},{"id":"y1-train","title":"Toy Train","topic":"Toy labels · a and an","type":"train","color":"#a8d884","icon":"train","x":17,"y":34,"subtitle":"Give the toys a label","guide":"Tap the word carriages in order. Build a toy label to move the train!","taskLabel":"Toy delivered","reminder":"Use a before red or big. Use an before orange or old.","tasks":[{"prompt":"Make a label for a red ball. Start with It.","words":["It","is","a","red","ball."],"answer":"It is a red ball.","full":"It is a red ball.","hint":"Start with It is. Add a red ball.","explain":"A red ball. A comes before the word red.","scene":"ball"},{"prompt":"Make a label for an orange kite. Start with It.","words":["It","is","an","orange","kite."],"answer":"It is an orange kite.","full":"It is an orange kite.","hint":"Start with It is. Add an orange kite.","explain":"An orange kite. An comes before orange.","scene":"girl"},{"prompt":"Make a label for a big train. Start with It.","words":["It","is","a","big","train."],"answer":"It is a big train.","full":"It is a big train.","hint":"Start with It is. Add a big train.","explain":"A big train. A comes before big.","scene":"boy"},{"prompt":"Make a label for an old car. Start with It.","words":["It","is","an","old","car."],"answer":"It is an old car.","full":"It is an old car.","hint":"Start with It is. Add an old car.","explain":"An old car. An comes before old.","scene":"boy"},{"prompt":"Make a label for a new doll. Start with It.","words":["It","is","a","new","doll."],"answer":"It is a new doll.","full":"It is a new doll.","hint":"Start with It is. Add a new doll.","explain":"A new doll. A comes before new.","scene":"girl"}]},{"id":"y1-river","title":"Classroom River","topic":"Classroom instructions","type":"build","color":"#69c8e8","icon":"boat","x":56,"y":74,"subtitle":"Help your class get ready","guide":"Put the word blocks in order. Each helpful instruction launches a boat!","taskLabel":"Boat launched","reminder":"A helpful instruction can end with please.","tasks":[{"prompt":"Ask your friend to open a book. Start with Open.","words":["Open","your","book,","please."],"answer":"Open your book, please.","full":"Open your book, please.","hint":"Start with Open. Add your book, then please.","explain":"Open your book, please. This is a helpful classroom instruction.","scene":"boy"},{"prompt":"Ask your friend to close a bag. Start with Close.","words":["Close","your","bag,","please."],"answer":"Close your bag, please.","full":"Close your bag, please.","hint":"Start with Close. Add your bag, then please.","explain":"Close your bag, please. Close tells your friend what to do.","scene":"girl"},{"prompt":"Ask for a pencil. Start with Pass.","words":["Pass","me","a","pencil,","please."],"answer":"Pass me a pencil, please.","full":"Pass me a pencil, please.","hint":"Start with Pass me. Add a pencil, then please.","explain":"Pass me a pencil, please. Please makes your request polite.","scene":"friends"},{"prompt":"Ask your friend to sit down. Start with Sit.","words":["Sit","down,","please."],"answer":"Sit down, please.","full":"Sit down, please.","hint":"Start with Sit. Then add down, and please.","explain":"Sit down, please. This tells your friend what to do.","scene":"boy"},{"prompt":"Ask your friend to look at a kite. Start with Look.","words":["Look","at","the","kite,","please."],"answer":"Look at the kite, please.","full":"Look at the kite, please.","hint":"Start with Look at. Add the kite, then please.","explain":"Look at the kite, please. Look at tells your friend where to look.","scene":"girl"}]},{"id":"y1-mine","title":"Pet Mine","topic":"I like · I do not like","type":"mine","color":"#acbcdf","icon":"pickaxe","x":68,"y":51,"subtitle":"Find a gem for each pet","guide":"Tap the word block that matches the story. Collect a pet gem!","taskLabel":"Pet gem found","reminder":"Like tells us what you enjoy. Do not like tells us what you do not enjoy.","tasks":[{"prompt":"Hana likes cats. She says: I ___ cats.","options":["like","do not like"],"answer":"like","full":"I like cats.","hint":"Hana likes cats. Choose like.","explain":"I like cats means Hana enjoys cats.","scene":"girl"},{"prompt":"Dan does not like snakes. He says: I ___ snakes.","options":["like","do not like"],"answer":"do not like","full":"I do not like snakes.","hint":"Dan does not like snakes. Choose do not like.","explain":"I do not like snakes tells us how Dan feels.","scene":"boy"},{"prompt":"May likes ducks. She says: I ___ ducks.","options":["like","do not like"],"answer":"like","full":"I like ducks.","hint":"May likes ducks. Choose like.","explain":"I like ducks means May enjoys ducks.","scene":"girl"},{"prompt":"Ben does not like rats. He says: I ___ rats.","options":["like","do not like"],"answer":"do not like","full":"I do not like rats.","hint":"Ben does not like rats. Choose do not like.","explain":"I do not like rats tells us how Ben feels.","scene":"boy"},{"prompt":"You enjoy dogs. Choose your words: I ___ dogs.","options":["do not like","like"],"answer":"like","full":"I like dogs.","hint":"You enjoy dogs. Say: I like dogs.","explain":"I like dogs tells people what you enjoy.","scene":"friends"}]},{"id":"y1-portal","title":"Lunchbox Portal","topic":"Lunchbox · have got","type":"portal","color":"#bea1fa","icon":"portal","x":80,"y":27,"subtitle":"Pack lunch for the journey","guide":"Tap a word portal. Choose the words that match each lunchbox!","taskLabel":"Lunchbox packed","reminder":"Have got tells us what is in a lunchbox. Have not got tells us what is missing.","tasks":[{"prompt":"An apple is in my lunchbox. I ___ an apple.","options":["have got","have not got"],"answer":"have got","full":"I have got an apple.","hint":"The apple is in the lunchbox. Say have got.","explain":"I have got an apple means I have an apple.","scene":"apple"},{"prompt":"There is no banana in my lunchbox. I ___ a banana.","options":["have got","have not got"],"answer":"have not got","full":"I have not got a banana.","hint":"The banana is missing. Say have not got.","explain":"I have not got a banana means I do not have a banana.","scene":"boy"},{"prompt":"We have some cheese. Have we got any cheese? Yes, we ___.","options":["have","have not"],"answer":"have","full":"Yes, we have.","hint":"The cheese is here. Say Yes, we have.","explain":"Yes, we have answers the question about the cheese.","scene":"friends"},{"prompt":"We have no cake. Have we got any cake? No, we ___.","options":["have","have not"],"answer":"have not","full":"No, we have not.","hint":"There is no cake. Say No, we have not.","explain":"No, we have not means we do not have cake.","scene":"friends"},{"prompt":"A sandwich is in my lunchbox. I have ___ a sandwich.","options":["got","get"],"answer":"got","full":"I have got a sandwich.","hint":"Use the words have got together.","explain":"I have got a sandwich tells us what is in the lunchbox.","scene":"girl"}]},{"id":"y1-rescue","title":"Pet Hideout","topic":"in · on · under","type":"rune","color":"#ff9c95","icon":"cat","x":42,"y":22,"subtitle":"Find the hidden pets","guide":"Read the clue. Tap a place word to help a pet get home!","taskLabel":"Pet found","reminder":"In means inside. On means on top. Under means below.","tasks":[{"prompt":"The cat is inside the box. The cat is ___ the box.","options":["in","on","under"],"answer":"in","full":"The cat is in the box.","hint":"Inside means in.","explain":"In the box means inside the box.","scene":"friends"},{"prompt":"The dog is on top of the bag. The dog is ___ the bag.","options":["under","on","in"],"answer":"on","full":"The dog is on the bag.","hint":"On top means on.","explain":"On the bag means on top of the bag.","scene":"friends"},{"prompt":"The frog is below the desk. The frog is ___ the desk.","options":["on","in","under"],"answer":"under","full":"The frog is under the desk.","hint":"Below means under.","explain":"Under the desk means below the desk.","scene":"friends"},{"prompt":"The rat is inside the bag. The rat is ___ the bag.","options":["under","in","on"],"answer":"in","full":"The rat is in the bag.","hint":"Inside means in.","explain":"In the bag means inside the bag.","scene":"friends"},{"prompt":"The cat is below the chair. The cat is ___ the chair.","options":["under","on","in"],"answer":"under","full":"The cat is under the chair.","hint":"Below means under.","explain":"Under the chair means below the chair.","scene":"friends"}]},{"id":"y1-castle","title":"Toy Castle","topic":"big · small · tall · short","type":"compare","color":"#e5b3f0","icon":"castle","x":89,"y":73,"subtitle":"Choose the right size","guide":"Look at the sizes. Tap the object that matches the words!","taskLabel":"Castle light switched on","reminder":"Look at both objects. Big and small tell us about size. Tall and short tell us about height.","tasks":[{"prompt":"Find the big chest.","answer":"big","full":"Chest B is big.","hint":"Look for the chest that takes up more space.","explain":"Chest B is big. Chest A is small.","objects":[{"id":"small","label":"Chest A","size":75},{"id":"big","label":"Chest B","size":150}],"objectType":"chest"},{"prompt":"Find the small chest.","answer":"small","full":"Chest A is small.","hint":"Look for the chest that takes up less space.","explain":"Chest A is small. Chest B is big.","objects":[{"id":"small","label":"Chest A","size":70},{"id":"big","label":"Chest B","size":142}],"objectType":"chest"},{"prompt":"Find the tall tower.","answer":"tall","full":"Tower B is tall.","hint":"Look for the tower that goes high up.","explain":"Tower B is tall. Tower A is short.","objects":[{"id":"short","label":"Tower A","size":75},{"id":"tall","label":"Tower B","size":150}],"objectType":"tower"},{"prompt":"Find the short tower.","answer":"short","full":"Tower B is short.","hint":"Look for the tower that does not go very high.","explain":"Tower B is short. Tower A is tall.","objects":[{"id":"tall","label":"Tower A","size":146},{"id":"short","label":"Tower B","size":75}],"objectType":"tower"},{"prompt":"Choose a big chest for the toys.","answer":"big","full":"Chest A is big.","hint":"Find the chest with more space for the toys.","explain":"Chest A is big. It has more space for toys.","objects":[{"id":"big","label":"Chest A","size":145},{"id":"small","label":"Chest B","size":72}],"objectType":"chest"}]}],"rules":[["shop","Meet your friends","My name is ... · I am seven.","Use these words to tell a friend your name and age.","My name is Hana. I am seven."],["bridge","His and her","His = a boy's · Her = a girl's","Use his or her to talk about a name or a favourite toy.","Her kite belongs to May. His ball belongs to Dan."],["train","Toy labels","a red ball · an orange kite","Use a before red. Use an before orange. Listen to the first sound of the next word.","It is an old car. It is a new doll."],["boat","Helpful instructions","Open ... · Close ... · Pass me ...","Tell a friend what to do. Add please to be polite.","Close your bag, please."],["pickaxe","What I like","I like ... · I do not like ...","Use these words to say what you enjoy.","I like cats. I do not like snakes."],["portal","My lunchbox","I have got ... · I have not got ...","Have got tells us what you have. Have not got tells us what is missing.","I have got an apple. I have not got a banana."],["cat","Where is the pet?","in = inside · on = on top · under = below","Use a place word to find the pet.","The cat is under the chair."],["castle","Sizes","big · small · tall · short","Big and small tell us about size. Tall and short tell us about height.","The chest is big. The tower is tall."]],"curriculum":{"document":"KSSR (Semakan 2017), SK, CEFR-aligned","title":"DSKP Bahasa Inggeris Tahun 1 — Primary Year 1 English Language Syllabus","url":"https://bpk.moe.gov.my/kurikulum/kssr/kssr-tahun-1/57-48-dskp-kssr-semakan-tahun-1-bahasa-inggeris-cefr-sk-v2/file","grammarPages":"Printed pages 50 and 55–57 (PDF pages 64 and 69–71)","learningStandards":["3.2.2: Read details in very simple phrases and sentences.","3.3.1: Enjoy simple digital word games.","4.2.1: Give a name or age through familiar fixed phrases.","4.2.3: Express likes and dislikes.","4.2.4: Name or describe familiar objects."],"note":"Original medium-challenge practice using the SK Year 1 syllabus language in playful contexts. Year 1 grammar is experienced through meaning, fixed phrases and enjoyment, with short choices, word blocks, audio and hints. This pack practises selected language; game points do not determine a DSKP performance level."}},"y2-low":{"year":2,"levelLabel":"Supported adventure · small steps","missions":[{"id":"y2l-market","title":"Counting Market","topic":"One or more · there is and there are","type":"rune","color":"#ffbd64","icon":"shop","x":18,"y":72,"subtitle":"Count the village supplies","guide":"Tap a word block. Count the supplies for the village!","taskLabel":"Shop supplied","reminder":"Use There is for one thing. Use There are for two or more.","tasks":[{"prompt":"One cap is here. There ___ a cap.","options":["is","are"],"answer":"is","full":"There is a cap.","hint":"One cap: say There is a cap.","explain":"There is tells us about one cap."},{"prompt":"Two shoes are here. There ___ two shoes.","options":["is","are"],"answer":"are","full":"There are two shoes.","hint":"Two shoes: say There are two shoes.","explain":"There are tells us about more than one shoe."},{"prompt":"One parrot is in the room. ___ a parrot.","options":["There are","There's"],"answer":"There's","full":"There's a parrot.","hint":"There's means There is.","explain":"There's a parrot tells us about one parrot."},{"prompt":"We want to count the hats. How ___ hats are there?","options":["old","many"],"answer":"many","full":"How many hats are there?","hint":"Ask How many? to count things.","explain":"How many hats are there? asks for the number of hats."},{"prompt":"Count the cars: car, car, car. There are ___ cars.","options":["two","three"],"answer":"three","full":"There are three cars.","hint":"Count each car: one, two, three.","explain":"There are three cars. Cars is the word for more than one car."}]},{"id":"y2l-bridge","title":"Weekend Bridge","topic":"Do you? · yes and no","type":"bridge","color":"#80d4ea","icon":"bridge","x":38,"y":56,"subtitle":"Ask about free time","guide":"Tap a word block. Ask about free time to build the bridge!","taskLabel":"Bridge block added","reminder":"Do you? asks about a routine. Reply Yes, I do or No, I don't.","tasks":[{"prompt":"You play tennis on Sundays. Do you play tennis on Sundays? Yes, I ___.","options":["do","don't"],"answer":"do","full":"Yes, I do.","hint":"You play tennis. Answer Yes, I do.","explain":"Yes, I do answers the question about your routine."},{"prompt":"You do not watch TV on Mondays. Do you watch TV on Mondays? No, I ___.","options":["do","don't"],"answer":"don't","full":"No, I don't.","hint":"You do not watch TV. Answer No, I don't.","explain":"No, I don't tells us that you do not do this activity."},{"prompt":"Complete the routine question: ___ you play football on Saturdays?","options":["Do","Is"],"answer":"Do","full":"Do you play football on Saturdays?","hint":"Start the question with Do you.","explain":"Do you play football on Saturdays? asks about a routine."},{"prompt":"You ride a bike at the weekend. Do you ride a bike at the weekend? Yes, I ___.","options":["don't","do"],"answer":"do","full":"Yes, I do.","hint":"You ride a bike. Answer Yes, I do.","explain":"Yes, I do means that this is your weekend activity."},{"prompt":"You do not play the piano on Fridays. Do you play the piano on Fridays? ___","options":["No, I don't.","Yes, I do."],"answer":"No, I don't.","full":"No, I don't.","hint":"You do not play the piano. Choose No, I don't.","explain":"No, I don't matches the routine in the clue."}]},{"id":"y2l-train","title":"Free-time Train","topic":"I play · on days of the week","type":"train","color":"#a8d884","icon":"train","x":17,"y":34,"subtitle":"Make a free-time plan","guide":"Tap the word carriages in order. Tell a friend your plan!","taskLabel":"Train journey completed","reminder":"Use on with a day. Start your sentence with I.","tasks":[{"prompt":"You play football every Monday. Make your sentence. Start with I.","words":["I","play","football","on","Mondays."],"answer":"I play football on Mondays.","full":"I play football on Mondays.","hint":"Start with I play. Add football on Mondays.","explain":"I play football on Mondays tells us your weekly activity."},{"prompt":"You watch TV every Friday. Make your sentence. Start with I.","words":["I","watch","TV","on","Fridays."],"answer":"I watch TV on Fridays.","full":"I watch TV on Fridays.","hint":"Start with I watch. Add TV on Fridays.","explain":"On Fridays tells us when you watch TV."},{"prompt":"You ride a bike every Sunday. Make your sentence. Start with I.","words":["I","ride","a","bike","on","Sundays."],"answer":"I ride a bike on Sundays.","full":"I ride a bike on Sundays.","hint":"Start with I ride. Add a bike on Sundays.","explain":"I ride a bike on Sundays tells us your weekly activity."},{"prompt":"You play tennis every Tuesday. Make your sentence. Start with I.","words":["I","play","tennis","on","Tuesdays."],"answer":"I play tennis on Tuesdays.","full":"I play tennis on Tuesdays.","hint":"Start with I play. Add tennis on Tuesdays.","explain":"On Tuesdays tells us when you play tennis."},{"prompt":"You play the piano every Saturday. Make your sentence. Start with I.","words":["I","play","the","piano","on","Saturdays."],"answer":"I play the piano on Saturdays.","full":"I play the piano on Saturdays.","hint":"Start with I play. Add the piano on Saturdays.","explain":"I play the piano on Saturdays tells us your weekly activity."}]},{"id":"y2l-river","title":"Clothes River","topic":"is wearing · clothes and colours","type":"build","color":"#69c8e8","icon":"boat","x":56,"y":74,"subtitle":"Dress for the journey","guide":"Put the word blocks in order. Describe the clothes to launch a boat!","taskLabel":"Boat launched","reminder":"Say is wearing to tell us about clothes someone has on now.","tasks":[{"prompt":"Amir has a red cap on. Describe his clothes. Start with Amir.","words":["Amir","is","wearing","a","red","cap."],"answer":"Amir is wearing a red cap.","full":"Amir is wearing a red cap.","hint":"Start with Amir is wearing. Add a red cap.","explain":"Amir is wearing a red cap tells us what he has on now."},{"prompt":"Hana has a blue jacket on. Describe her clothes. Start with Hana.","words":["Hana","is","wearing","a","blue","jacket."],"answer":"Hana is wearing a blue jacket.","full":"Hana is wearing a blue jacket.","hint":"Start with Hana is wearing. Add a blue jacket.","explain":"Hana is wearing a blue jacket tells us about her clothes."},{"prompt":"A girl has a green skirt on. Describe her clothes. Start with She.","words":["She","is","wearing","a","green","skirt."],"answer":"She is wearing a green skirt.","full":"She is wearing a green skirt.","hint":"Start with She is wearing. Add a green skirt.","explain":"She is wearing a green skirt tells us what the girl has on."},{"prompt":"A boy has blue shoes on. Describe his clothes. Start with He.","words":["He","is","wearing","blue","shoes."],"answer":"He is wearing blue shoes.","full":"He is wearing blue shoes.","hint":"Start with He is wearing. Add blue shoes.","explain":"He is wearing blue shoes tells us what the boy has on."},{"prompt":"Mia has a warm sweater on. Describe her clothes. Start with Mia.","words":["Mia","is","wearing","a","warm","sweater."],"answer":"Mia is wearing a warm sweater.","full":"Mia is wearing a warm sweater.","hint":"Start with Mia is wearing. Add a warm sweater.","explain":"Mia is wearing a warm sweater tells us about her clothes."}]},{"id":"y2l-mine","title":"Ability Mine","topic":"can · can't","type":"mine","color":"#acbcdf","icon":"pickaxe","x":68,"y":51,"subtitle":"Discover what friends can do","guide":"Read the clue. Tap a word block to find an ability gem!","taskLabel":"Ability gem found","reminder":"Can means able to do it. Can't means not able to do it.","tasks":[{"prompt":"Dan can swim. Dan says: I ___ swim.","options":["can","can't"],"answer":"can","full":"I can swim.","hint":"Dan can swim. Choose can.","explain":"I can swim tells us that Dan is able to swim."},{"prompt":"The robot cannot fly. It says: I ___ fly.","options":["can","can't"],"answer":"can't","full":"I can't fly.","hint":"Cannot and can't mean the same thing.","explain":"I can't fly tells us that the robot is not able to fly."},{"prompt":"Mia can skip. She ___ skip.","options":["can't","can"],"answer":"can","full":"She can skip.","hint":"Mia is able to skip. Choose can.","explain":"She can skip tells us about Mia's ability."},{"prompt":"Ben can run. Can you run, Ben? Yes, I ___.","options":["can","can't"],"answer":"can","full":"Yes, I can.","hint":"Ben can run. Answer Yes, I can.","explain":"Yes, I can answers the question about running."},{"prompt":"Hana cannot dance. Can you dance, Hana? No, I ___.","options":["can","can't"],"answer":"can't","full":"No, I can't.","hint":"Hana cannot dance. Answer No, I can't.","explain":"No, I can't tells us that Hana is not able to dance."}]},{"id":"y2l-portal","title":"Dressing Portal","topic":"this · these · clothes questions","type":"portal","color":"#bea1fa","icon":"portal","x":80,"y":27,"subtitle":"Choose clothes for the trip","guide":"Tap a word portal. Choose words for one item or more!","taskLabel":"Clothes portal opened","reminder":"Use this with one cap. Use these with shoes or socks.","tasks":[{"prompt":"One cap is here. Do you like ___ cap?","options":["this","these"],"answer":"this","full":"Do you like this cap?","hint":"One cap: use this cap.","explain":"This cap means one cap."},{"prompt":"Two shoes are here. Do you like ___ shoes?","options":["this","these"],"answer":"these","full":"Do you like these shoes?","hint":"Two shoes: use these shoes.","explain":"These shoes means more than one shoe."},{"prompt":"I like these socks. Do you like these socks? Yes, I ___.","options":["do","don't"],"answer":"do","full":"Yes, I do.","hint":"You like the socks. Answer Yes, I do.","explain":"Yes, I do tells us that you like the socks."},{"prompt":"I do not like this hat. Do you like this hat? No, I ___.","options":["do","don't"],"answer":"don't","full":"No, I don't.","hint":"You do not like the hat. Answer No, I don't.","explain":"No, I don't tells us that you do not like the hat."},{"prompt":"Ali is wearing a blue jacket. Is he wearing a blue jacket? Yes, he ___.","options":["is","isn't"],"answer":"is","full":"Yes, he is.","hint":"The blue jacket matches. Answer Yes, he is.","explain":"Yes, he is confirms that Ali is wearing a blue jacket."}]},{"id":"y2l-rescue","title":"Lost-and-Found Hideout","topic":"Where's? · Where are? · in","type":"rune","color":"#ff9c95","icon":"cat","x":42,"y":22,"subtitle":"Find the missing things","guide":"Read the clue. Tap the words to find the missing things!","taskLabel":"Lost item found","reminder":"Ask Where's? for one thing. Ask Where are? for more than one.","tasks":[{"prompt":"One book is in the bag. ___ the book?","options":["Where's","Where are"],"answer":"Where's","full":"Where's the book?","hint":"One book: ask Where's the book?","explain":"Where's means Where is. Use it to ask about one book."},{"prompt":"Two hats are in the box. ___ the hats?","options":["Where's","Where are"],"answer":"Where are","full":"Where are the hats?","hint":"Two hats: ask Where are the hats?","explain":"Where are asks about the place of more than one hat."},{"prompt":"Where's the cap? The cap is in the bag. ___ in the bag.","options":["They're","It's"],"answer":"It's","full":"It's in the bag.","hint":"One cap: say It's in the bag.","explain":"It's means It is. It takes the place of the cap."},{"prompt":"Where are the shoes? The shoes are in the box. ___ in the box.","options":["It's","They're"],"answer":"They're","full":"They're in the box.","hint":"Two shoes: say They're in the box.","explain":"They're means They are. They takes the place of the shoes."},{"prompt":"The map is inside the bag. The map is ___ the bag.","options":["is","in"],"answer":"in","full":"The map is in the bag.","hint":"Inside means in.","explain":"In the bag means inside the bag."}]},{"id":"y2l-castle","title":"Beach Castle","topic":"Let's · friendly replies","type":"rune","color":"#e5b3f0","icon":"castle","x":89,"y":73,"subtitle":"Make a plan with friends","guide":"Read the clue. Tap a suggestion or reply to light the castle!","taskLabel":"Castle light switched on","reminder":"Let's suggests an activity together. Say Good idea when you like the plan.","tasks":[{"prompt":"Choose the word to make a suggestion: ___ read a book.","options":["Let's","There"],"answer":"Let's","full":"Let's read a book.","hint":"Start your suggestion with Let's.","explain":"Let's read a book suggests reading together."},{"prompt":"Choose the activity that uses a camera: Let's ___.","options":["take a photo","make a sandcastle"],"answer":"take a photo","full":"Let's take a photo.","hint":"A camera helps us take a photo.","explain":"Let's take a photo suggests an activity with a camera."},{"prompt":"Your friend says, Let's play tennis. You like the idea. Say: ___","options":["Good idea.","I'm not sure."],"answer":"Good idea.","full":"Good idea.","hint":"You like the plan. Say Good idea.","explain":"Good idea tells your friend that you like the suggestion."},{"prompt":"Your friend says, Let's dance. You do not want to dance. Say: ___","options":["Good idea.","Sorry, I don't want to."],"answer":"Sorry, I don't want to.","full":"Sorry, I don't want to.","hint":"You do not want to dance. Say Sorry, I don't want to.","explain":"Sorry, I don't want to politely says that you do not want this activity."},{"prompt":"Choose the activity that uses paper and paints: Let's ___.","options":["catch a fish","paint a picture"],"answer":"paint a picture","full":"Let's paint a picture.","hint":"Use paper and paints to paint a picture.","explain":"Let's paint a picture suggests an activity with paper and paints."}]}],"rules":[["shop","Count the supplies","There is one ... · There are two ...","Use is for one thing. Use are for two or more.","There is a cap. There are two shoes."],["bridge","Ask about free time","Do you ...? · Yes, I do. · No, I don't.","Use these words to ask and answer about a routine.","Do you play tennis on Sundays? Yes, I do."],["train","Your weekly plan","I play ... on Mondays.","Use on with a day to tell a friend when you do an activity.","I ride a bike on Sundays."],["boat","Clothes now","He is wearing ... · She is wearing ...","Wearing tells us about clothes someone has on now.","She is wearing a green skirt."],["pickaxe","What you can do","I can ... · I can't ...","Can means able to do it. Cannot and can't mean the same thing.","I can swim. I can't fly."],["portal","One item or more","this cap · these shoes","Use this with one item. Use these with more than one item.","Do you like this cap? Do you like these shoes?"],["cat","Find the things","Where's ...? · Where are ...?","Use It's for one thing. Use They're for more than one. In means inside.","Where are the shoes? They're in the box."],["castle","Make a friendly plan","Let's ... · Good idea.","Use Let's to suggest an activity together. Say Good idea when you like the plan.","Let's paint a picture. Good idea."]],"curriculum":{"document":"KSSR (Semakan 2017), SK, CEFR-aligned, KPM BPK","title":"DSKP Bahasa Inggeris Tahun 2 — Primary Year 2 English Language Syllabus (SK)","url":"https://bpk.moe.gov.my/kurikulum/kssr/kssr-tahun-2/96-50-dskp-kssr-semakan-tahun-2-bahasa-inggeris-cefr-sk-v2/file","grammarPages":"Printed p. 48 (meaning-led grammar); pp. 54–56 (routines, counting, clothes, ability, suggestions, location). PDF pp. 62, 68–70.","learningStandards":["3.2.1–3.2.2, p. 36: Understand simple sentences and their details.","3.3.1, p. 36: Enjoy sentence-level digital games.","4.2.2 and 4.2.4, p. 41: Ability and object descriptions.","4.3.1 and 4.3.3, p. 41: Guided punctuation and sentence formation."],"note":"Original supported practice for 2B/2K. Short choices, familiar phrases and direct clues keep the focus on meaning and enjoyment. Selected grammar practice only; scores are not PBD levels or full DSKP assessment."}},"y2-challenge":{"year":2,"levelLabel":"Challenge adventure · read the clues","missions":[{"id":"y2c-market","title":"Market Explorer","topic":"Count and check · there is and there are","type":"rune","color":"#ffbd64","icon":"shop","x":18,"y":72,"subtitle":"Read the market clues","guide":"Read the list. Tap the word block that matches the supplies!","taskLabel":"Shop supplied","reminder":"Match the words to the number. One item needs is; two or more need are.","tasks":[{"prompt":"Market list: one jacket, two caps. There ___ two caps.","options":["is","am","are"],"answer":"are","full":"There are two caps.","hint":"The clue says two caps. Choose the words for more than one.","explain":"There are matches two caps. There is would describe one cap."},{"prompt":"Market list: three hats, no shoes. Are there any shoes? No, there ___.","options":["are","aren't","is"],"answer":"aren't","full":"No, there aren't.","hint":"Read the shoes part of the list. There are no shoes.","explain":"No, there aren't matches the question and the empty shoes list."},{"prompt":"Only one parrot is in the tower. Complete the yes-or-no question: ___ a parrot in the tower?","options":["Are there","How many","Is there"],"answer":"Is there","full":"Is there a parrot in the tower?","hint":"The question is about one parrot. Start with Is there.","explain":"Is there a parrot? asks whether one parrot is there."},{"prompt":"Room list: one robot, four cars. How many cars are there? There are ___.","options":["one robot","four cars","a car"],"answer":"four cars","full":"There are four cars.","hint":"Count the cars, not the robot.","explain":"How many cars? asks for the car count. The list has four cars."},{"prompt":"Box list: two books and one map. ___ a map in the box.","options":["There are","There aren't","There's"],"answer":"There's","full":"There's a map in the box.","hint":"The map is one item. Choose the words for one.","explain":"There's means There is. It matches one map."}]},{"id":"y2c-bridge","title":"Routine Bridge","topic":"Do you? · read a weekly plan","type":"bridge","color":"#80d4ea","icon":"bridge","x":38,"y":56,"subtitle":"Ask the right routine question","guide":"Read the plan. Tap an answer that matches the day and activity!","taskLabel":"Bridge block added","reminder":"Read the whole clue before answering. Do you? uses Yes, I do or No, I don't.","tasks":[{"prompt":"Sara: I ride a bike on Sundays. Do you ride a bike on Sundays, Sara? ___","options":["No, I don't.","Yes, I can.","Yes, I do."],"answer":"Yes, I do.","full":"Yes, I do.","hint":"Sara rides a bike on Sundays. The question starts with Do you.","explain":"Yes, I do matches both the routine and the Do you question."},{"prompt":"Dan: I play tennis on Saturdays. I do not play tennis on Mondays. Do you play tennis on Mondays, Dan? ___","options":["Yes, I do.","No, I don't.","No, I can't."],"answer":"No, I don't.","full":"No, I don't.","hint":"Check Monday, not Saturday.","explain":"No, I don't matches Dan's Monday routine."},{"prompt":"Mia: I watch TV on Fridays. Ask Mia about her Friday routine: ___ you watch TV on Fridays?","options":["Is","Do","Are"],"answer":"Do","full":"Do you watch TV on Fridays?","hint":"Use Do you to ask about this free-time routine.","explain":"Do you watch TV on Fridays? asks about Mia's weekly activity."},{"prompt":"Ali: I read a book on Tuesdays. Do you read a book on Tuesdays, Ali? Yes, I ___.","options":["am","can","do"],"answer":"do","full":"Yes, I do.","hint":"Match Do you with Yes, I do.","explain":"Yes, I do confirms that reading is Ali's Tuesday activity."},{"prompt":"Tim: I ride a bike at the weekend. I do not watch TV at the weekend. Do you watch TV at the weekend, Tim? No, I ___.","options":["don't","isn't","can't"],"answer":"don't","full":"No, I don't.","hint":"Check the TV clue, not the bike clue.","explain":"No, I don't matches the activity in the question."}]},{"id":"y2c-train","title":"Weekly-plan Train","topic":"Free-time sentences · on and at","type":"train","color":"#a8d884","icon":"train","x":17,"y":34,"subtitle":"Turn clues into a plan","guide":"Tap the word carriages in order. Turn each plan into a sentence!","taskLabel":"Train journey completed","reminder":"Use on with days, such as Mondays. Use at in at the weekend.","tasks":[{"prompt":"Your plan says: tennis, every Monday. Tell a friend. Start with I.","words":["I","play","tennis","on","Mondays."],"answer":"I play tennis on Mondays.","full":"I play tennis on Mondays.","hint":"Begin I play. Put the day after on.","explain":"I play tennis on Mondays gives the activity and the repeated day."},{"prompt":"You read a book each Friday. Tell a friend when. Start with I.","words":["I","read","a","book","on","Fridays."],"answer":"I read a book on Fridays.","full":"I read a book on Fridays.","hint":"Begin I read. Put on Fridays at the end.","explain":"On Fridays tells your friend which day this happens."},{"prompt":"Every Sunday is your bike day. Tell a friend your routine. Start with I.","words":["I","ride","a","bike","on","Sundays."],"answer":"I ride a bike on Sundays.","full":"I ride a bike on Sundays.","hint":"Begin I ride. Put the activity before the day.","explain":"I ride a bike on Sundays turns the weekly plan into a sentence."},{"prompt":"The piano is your activity every Saturday. Make your sentence. Start with I.","words":["I","play","the","piano","on","Saturdays."],"answer":"I play the piano on Saturdays.","full":"I play the piano on Saturdays.","hint":"Begin I play. Keep the piano together.","explain":"I play the piano on Saturdays gives the activity and the day."},{"prompt":"Your weekend activity is watching TV. Tell a friend. Start with I.","words":["I","watch","TV","at","the","weekend."],"answer":"I watch TV at the weekend.","full":"I watch TV at the weekend.","hint":"Begin I watch TV. Finish with at the weekend.","explain":"At the weekend tells us when you watch TV."}]},{"id":"y2c-river","title":"Clothes-check River","topic":"Wearing · statements and questions","type":"build","color":"#69c8e8","icon":"boat","x":56,"y":74,"subtitle":"Read clothes clues","guide":"Put the word blocks in order. Describe or check the clothes!","taskLabel":"Boat launched","reminder":"Describe clothes with is wearing. Start a clothes question with Is he or Is she.","tasks":[{"prompt":"Amir has a red cap on his head. Describe what he is wearing. Start with Amir.","words":["Amir","is","wearing","a","red","cap."],"answer":"Amir is wearing a red cap.","full":"Amir is wearing a red cap.","hint":"Begin Amir is wearing. Put the colour before cap.","explain":"Amir is wearing a red cap describes the clothes in the clue."},{"prompt":"Nia is a girl with a green skirt on. Describe her clothes. Start with She.","words":["She","is","wearing","a","green","skirt."],"answer":"She is wearing a green skirt.","full":"She is wearing a green skirt.","hint":"She replaces Nia. Begin She is wearing.","explain":"She is wearing a green skirt describes Nia's clothes."},{"prompt":"Dan is a boy with blue shoes on his feet. Describe his clothes. Start with He.","words":["He","is","wearing","blue","shoes."],"answer":"He is wearing blue shoes.","full":"He is wearing blue shoes.","hint":"He replaces Dan. Begin He is wearing.","explain":"He is wearing blue shoes describes Dan's clothes."},{"prompt":"Ben is a boy. You want to check if his T-shirt is blue. Build a question. Start with Is.","words":["Is","he","wearing","a","blue","T-shirt?"],"answer":"Is he wearing a blue T-shirt?","full":"Is he wearing a blue T-shirt?","hint":"Begin Is he wearing. Finish the question with a blue T-shirt?","explain":"Is he wearing a blue T-shirt? asks someone to check Ben's clothes."},{"prompt":"Mia is a girl. You want to check if she has a warm jacket on. Build a question. Start with Is.","words":["Is","she","wearing","a","warm","jacket?"],"answer":"Is she wearing a warm jacket?","full":"Is she wearing a warm jacket?","hint":"Begin Is she wearing. Finish with a warm jacket?","explain":"Is she wearing a warm jacket? asks someone to check Mia's clothes."}]},{"id":"y2c-mine","title":"Robot Ability Mine","topic":"can · can't · check the skill card","type":"mine","color":"#acbcdf","icon":"pickaxe","x":68,"y":51,"subtitle":"Match skills to the clue","guide":"Read the skill card. Tap the answer that matches the ability!","taskLabel":"Ability gem found","reminder":"Check the activity in the question. Can means able; can't means not able.","tasks":[{"prompt":"Robot card: swim yes; fly no. The robot ___ swim.","options":["can't","is","can"],"answer":"can","full":"The robot can swim.","hint":"Read the swim part of the card.","explain":"The robot can swim matches swim yes."},{"prompt":"Mia: I can run. I can't skip. Can you skip, Mia? ___","options":["Yes, I can.","No, I can't.","No, I don't."],"answer":"No, I can't.","full":"No, I can't.","hint":"The question asks about skipping, not running.","explain":"No, I can't matches Mia's skipping ability."},{"prompt":"Amir: I can dance. I can't fly. Amir ___ dance.","options":["is","can't","can"],"answer":"can","full":"Amir can dance.","hint":"Choose the words for the dance clue.","explain":"Amir can dance matches the first part of his skill card."},{"prompt":"Nia is a girl. Her card says: jump yes; swim no. She ___ swim.","options":["can","are","can't"],"answer":"can't","full":"She can't swim.","hint":"Check swim, not jump.","explain":"She can't swim matches swim no."},{"prompt":"Ben: I can stand on one leg. Ask Ben about this ability: ___ you stand on one leg?","options":["Are","Can","Is"],"answer":"Can","full":"Can you stand on one leg?","hint":"Start an ability question with Can you.","explain":"Can you stand on one leg? asks about Ben's ability."}]},{"id":"y2c-portal","title":"Clothes-choice Portal","topic":"this · these · read and reply","type":"portal","color":"#bea1fa","icon":"portal","x":80,"y":27,"subtitle":"Check the clothes together","guide":"Tap a word portal. Check the item, colour and reply!","taskLabel":"Clothes portal opened","reminder":"Use this for one item and these for more than one. Check colours before you reply.","tasks":[{"prompt":"Shop labels: one cap, two socks. Ask about the cap: Do you like ___ cap?","options":["these","they","this"],"answer":"this","full":"Do you like this cap?","hint":"The cap is one item.","explain":"This cap matches the one cap on the shop list."},{"prompt":"Shop labels: one cap, two socks. Ask about the socks: Do you like ___ socks?","options":["this","these","it"],"answer":"these","full":"Do you like these socks?","hint":"The socks are more than one item.","explain":"These socks matches the two socks on the shop list."},{"prompt":"Amir has a green jacket on. Is he wearing a blue jacket? ___","options":["Yes, he is.","No, he can't.","No, he isn't."],"answer":"No, he isn't.","full":"No, he isn't.","hint":"The question says blue. The clue says green.","explain":"No, he isn't is the reply because Amir's jacket is green."},{"prompt":"Hana has a red skirt on. Is she wearing a red skirt? Yes, she ___.","options":["isn't","is","are"],"answer":"is","full":"Yes, she is.","hint":"The colour and the clothing both match.","explain":"Yes, she is confirms the clothes in the clue."},{"prompt":"Mia: I like this cap. I do not like these shoes. Do you like these shoes, Mia? ___","options":["No, I don't.","Yes, I do.","No, I can't."],"answer":"No, I don't.","full":"No, I don't.","hint":"Read the shoes clue. The question is not about the cap.","explain":"No, I don't matches how Mia feels about the shoes."}]},{"id":"y2c-rescue","title":"Lost-item Hideout","topic":"Where's? · Where are? · match the place","type":"rune","color":"#ff9c95","icon":"cat","x":42,"y":22,"subtitle":"Find things from a list","guide":"Read both clues. Tap the words that find the right item!","taskLabel":"Lost item found","reminder":"One item uses Where's and It's. More than one uses Where are and They're.","tasks":[{"prompt":"Bag list: one book and two caps. Ask about the book: ___ the book?","options":["Where are","They're","Where's"],"answer":"Where's","full":"Where's the book?","hint":"The book is one item.","explain":"Where's the book? asks about the place of the one book."},{"prompt":"Bag list: one book and two caps. Ask about the caps: ___ the caps?","options":["Where's","Where are","It's"],"answer":"Where are","full":"Where are the caps?","hint":"The caps are more than one item.","explain":"Where are the caps? asks about the place of the two caps."},{"prompt":"One blue book is in a red bag. Two green books are in a black bag. Where's the blue book? ___","options":["They're in the red bag.","It's in the black bag.","It's in the red bag."],"answer":"It's in the red bag.","full":"It's in the red bag.","hint":"Find the blue book. There is only one blue book.","explain":"It's in the red bag uses It's for one book and matches its bag."},{"prompt":"One red cap is in a green box. Two red shoes are in a blue bag. Where are the shoes? ___","options":["They're in the green box.","They're in the blue bag.","It's in the blue bag."],"answer":"They're in the blue bag.","full":"They're in the blue bag.","hint":"Find the shoes. Use the words for more than one.","explain":"They're in the blue bag matches both the two shoes and their place."},{"prompt":"One map is in the bag. Where's the map? ___ in the bag.","options":["It's","There are","They're"],"answer":"It's","full":"It's in the bag.","hint":"Answer about the one map.","explain":"It's in the bag uses It for the one map."}]},{"id":"y2c-castle","title":"Beach-plan Castle","topic":"Let's · choose a matching reply","type":"rune","color":"#e5b3f0","icon":"castle","x":89,"y":73,"subtitle":"Plan an adventure together","guide":"Read the clue. Tap the suggestion or reply that matches the plan!","taskLabel":"Castle light switched on","reminder":"Let's suggests a plan. Good idea agrees. I'm not sure means you have not decided.","tasks":[{"prompt":"We have sand and a bucket. Choose the activity that uses both: Let's ___.","options":["read a book","make a sandcastle","play the piano"],"answer":"make a sandcastle","full":"Let's make a sandcastle.","hint":"Think about what you can make with sand and a bucket.","explain":"Let's make a sandcastle matches the materials in the clue."},{"prompt":"Paper and paints are ready. Choose the matching suggestion: Let's ___.","options":["take a photo","listen to music","paint a picture"],"answer":"paint a picture","full":"Let's paint a picture.","hint":"Which activity uses paper and paints?","explain":"Let's paint a picture matches the materials that are ready."},{"prompt":"Your friend says, Let's go swimming. You want to swim too. Choose your reply: ___","options":["I'm not sure.","Good idea.","Sorry, I don't want to."],"answer":"Good idea.","full":"Good idea.","hint":"You both want to swim. Choose the reply that agrees.","explain":"Good idea tells your friend that you want to follow the plan."},{"prompt":"Your friend says, Let's play tennis. You do not want to play. Choose your reply: ___","options":["Sorry, I don't want to.","Good idea.","I'm not sure."],"answer":"Sorry, I don't want to.","full":"Sorry, I don't want to.","hint":"You have decided that you do not want to play.","explain":"Sorry, I don't want to politely declines the tennis plan."},{"prompt":"Your friend says, Let's read a book. You have not decided if you want to read. Choose your reply: ___","options":["Good idea.","Sorry, I don't want to.","I'm not sure."],"answer":"I'm not sure.","full":"I'm not sure.","hint":"Choose the reply that means you have not decided.","explain":"I'm not sure tells your friend that you have not decided."}]}],"rules":[["shop","Check the supplies","There is ... · There are ... · How many ...?","Read the count. Use is for one and are for two or more. Ask How many? for a number.","How many hats are there? There are three hats."],["bridge","Check the routine","Do you ...? · Yes, I do. · No, I don't.","Read the activity and the day. Match your reply to both.","Do you watch TV on Fridays? Yes, I do."],["train","Tell your weekly plan","on Mondays · at the weekend","Put the activity after I. Use on with a day and at in at the weekend.","I play the piano on Saturdays."],["boat","Describe or check clothes","She is wearing ... · Is she wearing ...?","A statement tells us about clothes. A question asks someone to check them.","Is he wearing a blue T-shirt?"],["pickaxe","Check an ability","Can you ...? · Yes, I can. · No, I can't.","Read the activity in the question. A friend may be able to do one activity but not another.","Can you skip? No, I can't."],["portal","Check one item or more","this cap · these socks · Is he wearing ...?","Use this for one and these for more than one. Check the colour before replying.","Is he wearing a red cap? Yes, he is."],["cat","Match the item and place","Where's / It's · Where are / They're","Find the correct item. Then match one or more and its place.","Where's the map? It's in the bag."],["castle","Match a plan and a reply","Let's ... · Good idea. · I'm not sure.","Agree with Good idea. Say I'm not sure if you have not decided. Decline politely with Sorry, I don't want to.","Let's take a photo. Good idea."]],"curriculum":{"document":"KSSR (Semakan 2017), SK, CEFR-aligned, KPM BPK","title":"DSKP Bahasa Inggeris Tahun 2 — Primary Year 2 English Language Syllabus (SK)","url":"https://bpk.moe.gov.my/kurikulum/kssr/kssr-tahun-2/96-50-dskp-kssr-semakan-tahun-2-bahasa-inggeris-cefr-sk-v2/file","grammarPages":"Printed p. 48 (meaning-led grammar); pp. 54–56 (routines, counting, clothes, ability, suggestions, location). PDF pp. 62, 68–70.","learningStandards":["3.2.1–3.2.2, p. 36: Understand simple sentences and their details.","3.3.1, p. 36: Enjoy sentence-level digital games.","4.2.2 and 4.2.4, p. 41: Ability and object descriptions.","4.3.1 and 4.3.3, p. 41: Guided punctuation and sentence formation."],"note":"Original medium/high practice for 2S. Context and meaning add challenge within Year 2 forms. Selected grammar practice only; scores are not PBD levels or full DSKP assessment."}},"y3-supported":{"year":3,"levelLabel":"Step-by-step adventure","missions":[{"id":"y3-market","title":"Counting Market","topic":"There is · there are · plurals","type":"rune","color":"#ffbd64","icon":"shop","x":18,"y":72,"subtitle":"Count the village supplies","guide":"Tap the correct word block. Help the market count its supplies!","taskLabel":"Shop supplied","reminder":"There is goes with one thing. There are goes with more than one.","tasks":[{"prompt":"One apple is on the stall. There ___ one apple.","options":["is","are"],"answer":"is","full":"There is one apple.","hint":"One apple is one thing. Choose is.","explain":"There is one apple. Use is for one thing.","scene":"apple"},{"prompt":"Three bags are on the stall. There ___ three bags.","options":["is","are"],"answer":"are","full":"There are three bags.","hint":"Three bags are more than one. Choose are.","explain":"There are three bags. Use are for more than one thing.","scene":"friends"},{"prompt":"We have two boxes. There are two ___ here.","options":["box","boxes"],"answer":"boxes","full":"There are two boxes here.","hint":"More than one box: boxes.","explain":"Use boxes when there is more than one box.","scene":"friends"},{"prompt":"Two children visit the market. There are two ___.","options":["child","children"],"answer":"children","full":"There are two children.","hint":"One child. Two children.","explain":"Children is the word for more than one child.","scene":"friends"},{"prompt":"Two mice hide by the stall. There are two ___.","options":["mouse","mice"],"answer":"mice","full":"There are two mice.","hint":"One mouse. Two mice.","explain":"Mice is the word for more than one mouse.","scene":"friends"}]},{"id":"y3-bridge","title":"Friendship Bridge","topic":"he · she · they · his · her","type":"bridge","color":"#80d4ea","icon":"bridge","x":38,"y":56,"subtitle":"Help your friends cross","guide":"Tap the correct pronoun block. Build a bridge for your friends!","taskLabel":"Bridge block added","reminder":"Use he for a boy, she for a girl, and they for two or more people.","tasks":[{"prompt":"Amir is a boy. ___ is my friend.","options":["He","She","They"],"answer":"He","full":"Amir is a boy. He is my friend.","hint":"Amir is a boy. Choose He.","explain":"He takes the place of Amir.","scene":"boy"},{"prompt":"Mei is a girl. ___ is reading.","options":["He","She","They"],"answer":"She","full":"Mei is a girl. She is reading.","hint":"Mei is a girl. Choose She.","explain":"She takes the place of Mei.","scene":"girl"},{"prompt":"Amir and Mei play together. ___ are friends.","options":["He","She","They"],"answer":"They","full":"Amir and Mei play together. They are friends.","hint":"Amir and Mei are two people. Choose They.","explain":"They takes the place of Amir and Mei.","scene":"friends"},{"prompt":"This cap belongs to Amir. It is ___ cap.","options":["his","her"],"answer":"his","full":"It is his cap.","hint":"The cap belongs to a boy. Choose his.","explain":"His cap means the cap belongs to Amir.","scene":"boy"},{"prompt":"This ruler belongs to Mei. It is ___ ruler.","options":["his","her"],"answer":"her","full":"It is her ruler.","hint":"The ruler belongs to a girl. Choose her.","explain":"Her ruler means the ruler belongs to Mei.","scene":"girl"}]},{"id":"y3-train","title":"Routine Train","topic":"Every day · simple present","type":"train","color":"#a8d884","icon":"train","x":17,"y":34,"subtitle":"Build a daily routine","guide":"Tap the word carriages in order. Build a routine to move the train!","taskLabel":"Train journey completed","reminder":"Use play with I or they. Use plays with he or she.","tasks":[{"prompt":"Tell us your morning routine. Start with I.","words":["I","eat","breakfast","every","day."],"answer":"I eat breakfast every day.","full":"I eat breakfast every day.","hint":"Start with I eat. Finish with every day.","explain":"Every day tells us this is a routine. Use eat after I.","scene":"boy"},{"prompt":"Tell us how Mei goes to school. Start with She.","words":["She","walks","to","school."],"answer":"She walks to school.","full":"She walks to school.","hint":"Start with She. Then put walks.","explain":"She walks to school. Use walks after she for a routine.","scene":"girl"},{"prompt":"Tell us about the friends. Start with They.","words":["They","play","football","every","day."],"answer":"They play football every day.","full":"They play football every day.","hint":"Start with They play. Finish with every day.","explain":"They play football every day. Use play after they.","scene":"ball"},{"prompt":"Amir always packs his bag. Start with He.","words":["He","always","packs","his","bag."],"answer":"He always packs his bag.","full":"He always packs his bag.","hint":"Start with He always. Put packs next.","explain":"Always means every time. Use packs after he.","scene":"boy"},{"prompt":"Tell us what your group does after school. Start with We.","words":["We","read","books","after","school."],"answer":"We read books after school.","full":"We read books after school.","hint":"Start with We read. Finish with after school.","explain":"We read books after school. Use read after we.","scene":"friends"}]},{"id":"y3-river","title":"Action River","topic":"Actions now · am · is · are","type":"build","color":"#69c8e8","icon":"boat","x":56,"y":74,"subtitle":"Build actions happening now","guide":"Put the word blocks in order. Build a boat with an action happening now!","taskLabel":"Boat launched","reminder":"For an action happening now, use am, is or are with an -ing word.","tasks":[{"prompt":"You are reading now. Start with I.","words":["I","am","reading","a","book."],"answer":"I am reading a book.","full":"I am reading a book.","hint":"Start with I am. Add reading a book.","explain":"I am reading a book. Use am with I.","scene":"boy"},{"prompt":"Mei is singing now. Start with She.","words":["She","is","singing","now."],"answer":"She is singing now.","full":"She is singing now.","hint":"Start with She is. Put singing next.","explain":"She is singing now. Use is with she.","scene":"girl"},{"prompt":"The boys are playing now. Start with They.","words":["They","are","playing","football."],"answer":"They are playing football.","full":"They are playing football.","hint":"Start with They are. Put playing next.","explain":"They are playing football. Use are with they.","scene":"ball"},{"prompt":"Amir is eating now. Start with He.","words":["He","is","eating","an","apple."],"answer":"He is eating an apple.","full":"He is eating an apple.","hint":"Start with He is. Add eating an apple.","explain":"He is eating an apple. Use is with he.","scene":"apple"},{"prompt":"Your group is drawing now. Start with We.","words":["We","are","drawing","now."],"answer":"We are drawing now.","full":"We are drawing now.","hint":"Start with We are. Put drawing next.","explain":"We are drawing now. Use are with we.","scene":"friends"}]},{"id":"y3-mine","title":"Yesterday Mine","topic":"Yesterday · simple past","type":"mine","color":"#acbcdf","icon":"pickaxe","x":68,"y":51,"subtitle":"Find words from the past","guide":"Tap the correct word block. Find a gem for each action from yesterday!","taskLabel":"Past gem found","reminder":"Yesterday is in the past. Play becomes played. Go becomes went.","tasks":[{"prompt":"Yesterday, I ___ a game.","options":["play","played"],"answer":"played","full":"Yesterday, I played a game.","hint":"Yesterday is in the past. Play becomes played.","explain":"Played tells us the action happened in the past.","scene":"boy"},{"prompt":"Yesterday, Mei ___ her grandma.","options":["visited","visit"],"answer":"visited","full":"Yesterday, Mei visited her grandma.","hint":"Visit becomes visited for the past.","explain":"Visited tells us Mei saw her grandma in the past.","scene":"girl"},{"prompt":"Yesterday, Amir ___ to the park.","options":["go","went"],"answer":"went","full":"Yesterday, Amir went to the park.","hint":"Go changes to went in the past.","explain":"Went is the past word for go.","scene":"boy"},{"prompt":"Last night, we ___ rice.","options":["ate","eat"],"answer":"ate","full":"Last night, we ate rice.","hint":"Eat changes to ate in the past.","explain":"Ate tells us the meal happened last night.","scene":"friends"},{"prompt":"Yesterday, they ___ a film.","options":["watch","watched"],"answer":"watched","full":"Yesterday, they watched a film.","hint":"Watch becomes watched for the past.","explain":"Watched tells us the action happened yesterday.","scene":"friends"}]},{"id":"y3-portal","title":"Linking Portal","topic":"and · or · but","type":"portal","color":"#bea1fa","icon":"portal","x":80,"y":27,"subtitle":"Join the story blocks","guide":"Read the story clue. Tap a linking word to open the portal!","taskLabel":"Story portal opened","reminder":"And adds. Or gives a choice. But joins different or opposite ideas.","tasks":[{"prompt":"We need both things. Bring a pencil ___ a ruler.","options":["and","or","but"],"answer":"and","full":"Bring a pencil and a ruler.","hint":"We need both a pencil and a ruler. Use and.","explain":"And joins the two things we need.","scene":"friends"},{"prompt":"Choose one drink. Would you like milk ___ water?","options":["and","but","or"],"answer":"or","full":"Would you like milk or water?","hint":"You choose one drink. Use or.","explain":"Or gives you a choice between two drinks.","scene":"friends"},{"prompt":"Join these opposite ideas: I like cats, ___ I do not like snakes.","options":["or","but","and"],"answer":"but","full":"I like cats, but I do not like snakes.","hint":"One animal is liked. The other is not. Use but to show the difference.","explain":"But connects the different ideas about cats and snakes.","scene":"friends"},{"prompt":"Both friends are here. Amir ___ Mei are in the village.","options":["but","and","or"],"answer":"and","full":"Amir and Mei are in the village.","hint":"Both friends are here. Use and to name both.","explain":"And connects the names of the two friends.","scene":"friends"},{"prompt":"Join these surprising ideas: The box is small, ___ it is heavy.","options":["and","or","but"],"answer":"but","full":"The box is small, but it is heavy.","hint":"The box is small, yet it is heavy. Use but to show the surprise.","explain":"But shows the difference: the box is small, yet it is heavy.","scene":"friends"}]},{"id":"y3-rescue","title":"Animal Rescue","topic":"in · on · under · behind · between","type":"place","color":"#ff9c95","icon":"cat","x":42,"y":22,"subtitle":"Give the cat a safe place","guide":"Tap the cat, then tap its place. You can also drag the cat!","taskLabel":"Cat rescued","reminder":"Read the place word. In is inside. Behind is at the back. Between is in the middle.","tasks":[{"prompt":"The cat is in the box.","answer":"in","full":"The cat is in the box.","hint":"In means inside. Tap the inside of the box.","explain":"In the box means inside the box."},{"prompt":"The cat is on the table.","answer":"on","full":"The cat is on the table.","hint":"On means on top. Tap the table top.","explain":"On the table means on top of the table."},{"prompt":"The cat is under the table.","answer":"under","full":"The cat is under the table.","hint":"Under means below. Tap the space below the table.","explain":"Under the table means below the table."},{"prompt":"The cat is behind the tree.","answer":"behind","full":"The cat is behind the tree.","hint":"Behind means at the back. Tap the space behind the tree.","explain":"Behind the tree means at the back of the tree."},{"prompt":"The cat is between the rocks.","answer":"between","full":"The cat is between the rocks.","hint":"Between means in the middle of two things. Tap the space between the rocks.","explain":"Between the rocks means in the middle of the two rocks."}]},{"id":"y3-castle","title":"Size Castle","topic":"taller · shorter · bigger · smaller","type":"compare","color":"#e5b3f0","icon":"castle","x":89,"y":73,"subtitle":"Compare two objects","guide":"Look at both objects. Tap the one that matches the words!","taskLabel":"Castle light switched on","reminder":"Taller and shorter compare heights. Bigger and smaller compare sizes.","tasks":[{"prompt":"Choose the taller tower.","answer":"taller","full":"Tower B is taller than Tower A.","hint":"Look for the tower that is higher than the other.","explain":"Tower B is taller than Tower A.","objects":[{"id":"shorter","label":"Tower A","size":75},{"id":"taller","label":"Tower B","size":146}],"objectType":"tower"},{"prompt":"Choose the shorter tower.","answer":"shorter","full":"Tower A is shorter than Tower B.","hint":"Look for the tower that is lower than the other.","explain":"Tower A is shorter than Tower B.","objects":[{"id":"shorter","label":"Tower A","size":78},{"id":"taller","label":"Tower B","size":151}],"objectType":"tower"},{"prompt":"Choose the bigger chest.","answer":"bigger","full":"Chest A is bigger than Chest B.","hint":"Look for the chest that takes up more space.","explain":"Chest A is bigger than Chest B.","objects":[{"id":"bigger","label":"Chest A","size":145},{"id":"smaller","label":"Chest B","size":75}],"objectType":"chest"},{"prompt":"Choose the smaller chest.","answer":"smaller","full":"Chest B is smaller than Chest A.","hint":"Look for the chest that takes up less space.","explain":"Chest B is smaller than Chest A.","objects":[{"id":"bigger","label":"Chest A","size":143},{"id":"smaller","label":"Chest B","size":72}],"objectType":"chest"},{"prompt":"Choose the taller tower for the flag.","answer":"taller","full":"Tower A is taller than Tower B.","hint":"Compare the two towers. Which one is higher?","explain":"Tower A is taller than Tower B. Taller compares two heights.","objects":[{"id":"taller","label":"Tower A","size":150},{"id":"shorter","label":"Tower B","size":80}],"objectType":"tower"}]}],"rules":[["shop","Counting supplies","There is one ... · There are two ...","Use is for one. Use are for more than one. Some plural words change.","One child, two children. One mouse, two mice."],["bridge","Talking about friends","he · she · they · his · her","Use he for a boy, she for a girl, and they for two or more people. His and her show who owns something.","Mei is a girl. She has a ruler. It is her ruler."],["train","Daily routines","I play · She plays · They play","Use these words for routines. Always means every time.","He always packs his bag."],["boat","Actions now","am / is / are + an -ing word","Use am with I, is with he or she, and are with we or they.","We are drawing now."],["pickaxe","Actions in the past","play → played · go → went · eat → ate","Yesterday and last night tell us an action is in the past.","Yesterday, Amir went to the park."],["portal","Linking words","and = add · or = choose · but = show a difference","Choose a word that matches the ideas you want to join.","I like cats, but I do not like snakes."],["cat","Places","in · on · under · behind · between","Inside · on top · below · at the back · in the middle of two things.","The cat is between the rocks."],["castle","Comparing two things","tall → taller · big → bigger · small → smaller","Use taller or shorter for height. Use bigger or smaller for size.","Tower A is taller than Tower B."]],"curriculum":{"document":"KSSR (Semakan 2017), SK, CEFR-aligned","title":"DSKP Bahasa Inggeris SK Tahun 3 — Primary Year 3 English Language Syllabus","url":"https://bpk.moe.gov.my/kurikulum/kssr/kssr-tahun-3/102-001-dskp-kssr-semakan-2017-bi-sk-thn3-print/file","grammarPages":"Printed pages 43–45 (PDF pages 57–59); recycled Year 1–2 structures in Appendix 2","learningStandards":["3.2.2: Read details in short, simple texts.","4.2.4: Describe people and objects with suitable vocabulary.","4.2.5: Link sentences with basic coordinating conjunctions.","4.3.1: Practise capitals and sentence punctuation through guided word ordering.","4.3.3: Plan and form a range of simple sentences."],"note":"Original supported practice for pupils needing short, scaffolded tasks. Content selects Year 3 grammar and recycled Year 1–2 language: plurals, pronouns, present simple and continuous, simple past, conjunctions, position words and short-adjective comparisons. Hints, audio, small choices and retry feedback support learning. Game points do not determine a DSKP performance level."}},"y4-supported":{"year":4,"levelLabel":"Step by step","missions":[{"id":"y4-market","title":"Picnic Market","topic":"much · many · some · any · there is / are","type":"rune","color":"#ffbd64","icon":"shop","x":18,"y":72,"subtitle":"Pack food for the picnic","guide":"Read the food clue. Tap a word block to pack the picnic basket!","taskLabel":"Picnic food packed","reminder":"Count carrots: many carrots. Milk is an amount: much milk. Use some in these positive sentences and any after isn't.","tasks":[{"prompt":"We can count the carrots. How ___ carrots are in the basket?","options":["much","many"],"answer":"many","full":"How many carrots are in the basket?","hint":"One carrot, two carrots. We can count them. Use many.","explain":"Use many with carrots because carrots can be counted.","scene":"apple"},{"prompt":"Milk is a liquid. How ___ milk is in the bottle?","options":["much","many"],"answer":"much","full":"How much milk is in the bottle?","hint":"Milk is an amount. Use much with milk.","explain":"Use much to ask about an amount of milk.","scene":"apple"},{"prompt":"The basket has oranges. There are ___ oranges in the basket.","options":["any","some"],"answer":"some","full":"There are some oranges in the basket.","hint":"This sentence says we have oranges. Use some.","explain":"Some tells us there are oranges without giving an exact number.","scene":"apple"},{"prompt":"The cup is empty. There isn't ___ juice in the cup.","options":["some","any"],"answer":"any","full":"There isn't any juice in the cup.","hint":"Isn't makes this sentence negative. Use any.","explain":"There isn't any juice means there is no juice in the cup.","scene":"apple"},{"prompt":"Some bread is on the stall. There ___ some bread on the stall.","options":["is","are"],"answer":"is","full":"There is some bread on the stall.","hint":"Bread is an amount of food. Use There is some bread.","explain":"Use is with an uncountable amount such as some bread.","scene":"apple"}]},{"id":"y4-bridge","title":"Belongings Bridge","topic":"hers · mine · yours · whose · 's","type":"bridge","color":"#80d4ea","icon":"bridge","x":38,"y":56,"subtitle":"Return the lost belongings","guide":"Read who owns each thing. Tap the right block to return it!","taskLabel":"Belonging returned","reminder":"Mine, yours and hers can stand alone. Whose asks who owns something. Ali's means belonging to Ali.","tasks":[{"prompt":"Aina is a girl. She owns this hat. The hat is ___.","options":["hers","her"],"answer":"hers","full":"The hat is hers.","hint":"Her goes before a thing: her hat. Hers can finish this sentence.","explain":"The hat is hers means the hat belongs to Aina.","scene":"girl"},{"prompt":"I own this red bag. The bag is ___.","options":["my","mine"],"answer":"mine","full":"The bag is mine.","hint":"My goes before bag. Mine can stand alone: The bag is mine.","explain":"Mine means belonging to me.","scene":"boy"},{"prompt":"This map belongs to you. The map is ___.","options":["yours","your"],"answer":"yours","full":"The map is yours.","hint":"Your goes before map. Yours can finish this sentence.","explain":"Yours means belonging to you.","scene":"friends"},{"prompt":"Ask who owns the bike: '___ bike is this?' 'It is Ali's bike.'","options":["Why","Whose"],"answer":"Whose","full":"Whose bike is this? It is Ali's bike.","hint":"Whose asks who owns a thing. Use Whose bike is this?","explain":"Whose asks about the owner. Ali's tells us that Ali owns the bike.","scene":"boy"},{"prompt":"The toy belongs to one cat. It is the ___ toy.","options":["cats'","cat's"],"answer":"cat's","full":"It is the cat's toy.","hint":"There is one cat. Add 's to cat: the cat's toy.","explain":"Cat's means belonging to one cat. Cats' would mean belonging to more than one cat.","scene":"friends"}]},{"id":"y4-train","title":"Time Clue Train","topic":"Every day · now · present simple / continuous","type":"train","color":"#a8d884","icon":"train","x":17,"y":34,"subtitle":"Spot a routine or an action now","guide":"Read the time clue. Put the word carriages in order to move the train!","taskLabel":"Time clue solved","reminder":"Every day tells us about a routine. Now tells us an action is happening: am, is or are + an -ing word.","tasks":[{"prompt":"Tell your daily routine. Start with I and finish with every day.","words":["I","feed","the","cat","every","day."],"answer":"I feed the cat every day.","full":"I feed the cat every day.","hint":"Start I feed the cat. Finish every day.","explain":"Feed describes a routine. Every day tells us how often it happens.","scene":"boy"},{"prompt":"The cat is sleeping at this moment. Start with The and finish with now.","words":["The","cat","is","sleeping","now."],"answer":"The cat is sleeping now.","full":"The cat is sleeping now.","hint":"Start The cat is. Add sleeping now.","explain":"Is sleeping describes an action happening now.","scene":"friends"},{"prompt":"Hana does this every morning. Start with Hana and finish with flowers.","words":["Hana","waters","the","flowers."],"answer":"Hana waters the flowers.","full":"Hana waters the flowers.","hint":"Start Hana waters. Add the flowers.","explain":"This is Hana's routine. Use waters with one person such as Hana.","scene":"girl"},{"prompt":"Two children are running at this moment. Start with They and finish with now.","words":["They","are","running","now."],"answer":"They are running now.","full":"They are running now.","hint":"Start They are. Add running now.","explain":"Use are with they. Are running describes an action happening now.","scene":"friends"},{"prompt":"You are carrying a bag at this moment. Tell us the action. Start with I.","words":["I","am","carrying","a","bag."],"answer":"I am carrying a bag.","full":"I am carrying a bag.","hint":"Start I am. Add carrying a bag.","explain":"Use am with I. Am carrying describes your action now.","scene":"boy"}]},{"id":"y4-river","title":"Wish River","topic":"enjoy / love + ing · want + to","type":"build","color":"#69c8e8","icon":"boat","x":56,"y":74,"subtitle":"Tell us what you enjoy or want","guide":"Put the word blocks in order. Build a wish or a favourite activity!","taskLabel":"Wish boat launched","reminder":"Enjoy goes with an -ing word: enjoy playing. Want goes with to + a verb: want to play. Love can also go with an -ing word.","tasks":[{"prompt":"You enjoy games. Build the sentence. Start with I and finish with games.","words":["I","enjoy","playing","games."],"answer":"I enjoy playing games.","full":"I enjoy playing games.","hint":"Start I enjoy. Add playing games.","explain":"Use playing after enjoy: I enjoy playing games.","scene":"boy"},{"prompt":"Aina wants a drink. Start with Aina and finish with water.","words":["Aina","wants","to","drink","water."],"answer":"Aina wants to drink water.","full":"Aina wants to drink water.","hint":"Start Aina wants. Add to drink water.","explain":"Use to drink after wants. Aina wants to drink water.","scene":"girl"},{"prompt":"You love making pictures. Start with I and finish with pictures.","words":["I","love","drawing","pictures."],"answer":"I love drawing pictures.","full":"I love drawing pictures.","hint":"Start I love. Add drawing pictures.","explain":"Love can go with an -ing activity: I love drawing pictures.","scene":"boy"},{"prompt":"You and your friends want to help the cat. Start with We and finish with cat.","words":["We","want","to","help","the","cat."],"answer":"We want to help the cat.","full":"We want to help the cat.","hint":"Start We want to help. Add the cat.","explain":"Use to help after want. We want to help the cat.","scene":"friends"},{"prompt":"Zaki enjoys books. Start with Zaki and finish with books.","words":["Zaki","enjoys","reading","books."],"answer":"Zaki enjoys reading books.","full":"Zaki enjoys reading books.","hint":"Start Zaki enjoys. Add reading books.","explain":"Use reading after enjoys: Zaki enjoys reading books.","scene":"boy"}]},{"id":"y4-mine","title":"Memory Mine","topic":"Past actions · helped · went · saw · could","type":"mine","color":"#acbcdf","icon":"pickaxe","x":68,"y":51,"subtitle":"Find memories and past skills","guide":"Read the past clue. Mine the word block that completes the memory!","taskLabel":"Memory gem found","reminder":"Yesterday and last night are in the past. Help becomes helped, go becomes went, and see becomes saw. Could describes a past ability.","tasks":[{"prompt":"Yesterday, Sara ___ her mum in the garden.","options":["helped","help"],"answer":"helped","full":"Yesterday, Sara helped her mum in the garden.","hint":"Yesterday is in the past. Add ed to help: helped.","explain":"Helped tells us Sara's action happened yesterday.","scene":"girl"},{"prompt":"Last night, I ___ to bed at nine.","options":["go","went"],"answer":"went","full":"Last night, I went to bed at nine.","hint":"Last night is in the past. Go changes to went.","explain":"Went is the past form of go.","scene":"boy"},{"prompt":"Yesterday, we ___ a small boat on the river.","options":["saw","see"],"answer":"saw","full":"Yesterday, we saw a small boat on the river.","hint":"Yesterday is in the past. See changes to saw.","explain":"Saw is the past form of see.","scene":"friends"},{"prompt":"Ali was able to swim at age four. He ___ swim when he was four.","options":["can","could"],"answer":"could","full":"He could swim when he was four.","hint":"The clue tells us about a past skill. Use could.","explain":"Could swim means he was able to swim in the past.","scene":"boy"},{"prompt":"Nora could ___ a bike when she was six.","options":["rode","ride"],"answer":"ride","full":"Nora could ride a bike when she was six.","hint":"Could already tells us about the past. Use ride after could.","explain":"Use the base verb ride after could: could ride.","scene":"girl"}]},{"id":"y4-portal","title":"Plan Portal","topic":"am / is / are going to · future plans","type":"portal","color":"#bea1fa","icon":"portal","x":80,"y":27,"subtitle":"Make a plan for tomorrow","guide":"Read each plan. Tap the correct block to open tomorrow's portal!","taskLabel":"Plan portal opened","reminder":"For a plan, use am, is or are + going to + a verb. I am going to plant. She is going to plant. We are going to plant.","tasks":[{"prompt":"You plan to plant seeds tomorrow. I ___ going to plant seeds tomorrow.","options":["is","am"],"answer":"am","full":"I am going to plant seeds tomorrow.","hint":"Use am with I: I am going to plant.","explain":"I am going to plant describes your plan for tomorrow.","scene":"boy"},{"prompt":"Mira plans to read tonight. She ___ going to read tonight.","options":["is","are"],"answer":"is","full":"She is going to read tonight.","hint":"Use is with she: She is going to read.","explain":"She is going to read describes Mira's plan.","scene":"girl"},{"prompt":"The children plan to visit the park. They ___ going to visit the park.","options":["is","are"],"answer":"are","full":"They are going to visit the park.","hint":"Use are with they: They are going to visit.","explain":"They are going to visit describes the children's plan.","scene":"friends"},{"prompt":"We have a plan for tomorrow. We are going to ___ the cat.","options":["feed","fed"],"answer":"feed","full":"We are going to feed the cat.","hint":"After going to, use feed. Going to feed is the plan.","explain":"Use the base verb feed after going to.","scene":"friends"},{"prompt":"Choose the correct sentence for your plan to make a kite tomorrow.","options":["I going to make a kite tomorrow.","I am going to make a kite tomorrow.","I am going make a kite tomorrow."],"answer":"I am going to make a kite tomorrow.","full":"I am going to make a kite tomorrow.","hint":"You need I am going to make. Check for both am and to.","explain":"A complete plan uses am going to before the verb make.","scene":"boy"}]},{"id":"y4-rescue","title":"Reason Rescue","topic":"Why? · because · give a reason","type":"rune","color":"#ff9c95","icon":"cat","x":42,"y":22,"subtitle":"Explain how to help the cat","guide":"Read the cat's clue. Choose a reason to help the rescue team!","taskLabel":"Rescue reason explained","reminder":"Why asks for a reason. Because introduces a reason: We help the cat because it is cold.","tasks":[{"prompt":"Give a reason: The cat is hiding ___ it is afraid.","options":["because","and"],"answer":"because","full":"The cat is hiding because it is afraid.","hint":"Being afraid is the reason. Use because to give a reason.","explain":"Because links the cat's action to its reason: it is afraid.","scene":"friends"},{"prompt":"Ask for a reason: '___ is the cat wet?' 'Because it fell into the water.'","options":["Whose","Why"],"answer":"Why","full":"Why is the cat wet? Because it fell into the water.","hint":"The reply starts with Because. Ask for the reason with Why.","explain":"Why asks for a reason. Falling into the water explains why the cat is wet.","scene":"friends"},{"prompt":"The cat has no food. Choose the sentence that explains why it is hungry.","options":["The cat is hungry because it is full.","The cat is hungry because it has no food."],"answer":"The cat is hungry because it has no food.","full":"The cat is hungry because it has no food.","hint":"The clue says there is no food. Use that reason after because.","explain":"Having no food is the reason the cat is hungry. Because joins the two ideas.","scene":"friends"},{"prompt":"Give a reason for your opinion: I like this cat ___ it is friendly.","options":["but","because"],"answer":"because","full":"I like this cat because it is friendly.","hint":"Being friendly is your reason for liking the cat. Use because.","explain":"Because introduces a reason for your opinion.","scene":"boy"},{"prompt":"The cat is cold. Choose the sentence that gives the reason for a blanket.","options":["We give the cat a blanket because it is cold.","We give the cat a blanket because it is hot."],"answer":"We give the cat a blanket because it is cold.","full":"We give the cat a blanket because it is cold.","hint":"The clue says the cat is cold. Put that reason after because.","explain":"The cat is cold is the reason for giving it a blanket.","scene":"friends"}]},{"id":"y4-castle","title":"Comparison Castle","topic":"taller than · shorter than · bigger than · smaller than","type":"compare","color":"#e5b3f0","icon":"castle","x":89,"y":73,"subtitle":"Compare the castle objects","guide":"Look at the labels and sizes. Tap the object that
