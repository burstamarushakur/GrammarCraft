p.","full":"Some children have lamps, but nobody has a map.","hint":"Only two of the four children have lamps. Check the map statement separately.","explain":"Some accurately describes two of the four children. Nobody correctly reports that no child has a map. Both errors in the draft are fixed.","scene":"friends","dskpTopic":"Year 6 indefinite pronouns; recycled conjunctions and quantities","learningStandard":"3.2.2 / 4.3.3 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil checks two separate claims against a four-person set, detects both overgeneralisation and a false existence claim, and selects the only edit that fixes both."}]},{"id":"y6h-portal","title":"Decision Portal","subtitle":"Make a future plan from the clues","topic":"First conditional · future forms · timetables","type":"portal","icon":"portal","color":"#bea1fa","x":80,"y":27,"guide":"Choose the future message that fits every time, rule and plan clue.","taskLabel":"Decision portal opened","reminder":"Remember: In a first conditional, use present simple after if and will plus a base verb for the result. Timetables can use present simple.","tasks":[{"prompt":"Tomorrow's timetable says 9:00 am. Complete the timetable sentence: The train ___ at nine tomorrow morning.","options":["left","leaves","leaving"],"answer":"leaves","full":"The train leaves at nine tomorrow morning.","hint":"A fixed timetable can use present simple even when the event is tomorrow.","explain":"Leaves is present simple with the singular subject train. Present simple is used for this scheduled future event.","scene":"friends","dskpTopic":"Year 6 present simple for future events","learningStandard":"2.1.4 / 4.2.2 (supporting language practice)","kbat":false,"cognitiveLevel":"understand"},{"prompt":"The race uses the field on dry days. On rainy days, it uses the hall only if the hall is open. Tomorrow the hall is closed. Which plan follows both rules if it rains?","options":["If it rains, gStandard":"2.1.4 / 4.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"evaluate","kbatRationale":"The pupil evaluates the certainty of two different pieces of information and selects a message that treats the planned action and uncertain forecast appropriately."}]},{"id":"y6h-rescue","title":"Rescue Rules","subtitle":"Choose advice with a clear reason","topic":"should · must · have to · do not have to","type":"rune","icon":"cat","color":"#ff9c95","x":42,"y":22,"guide":"Check the rules and the evidence. Choose accurate advice for the rescue team.","taskLabel":"Rescue team helped","reminder":"Remember: Should gives advice. Must and have to can show an obligation. Do not have to means something is not required.","tasks":[{"prompt":"Choose the grammatically correct advice for a child who needs help with a difficult task.","options":["You should to ask an adult for help.","You should ask an adult for help.","You should asks an adult for help."],"answer":"You should ask an adult for help.","full":"You should ask an adult for help.","hint":"Put a base verb directly after should, without to or s.","explain":"Should gives advice and is followed directly by the base verb ask.","scene":"friends","dskpTopic":"Year 6 modal verbs for advice","learningStandard":"2.1.3 (supporting language practice)","kbat":false,"cognitiveLevel":"remember"},{"prompt":"Wearing a helmet is a camp rule. Complete the sentence: Mina ___ to wear a helmet.","options":["have","having","has"],"answer":"has","full":"Mina has to wear a helmet.","hint":"Use has with one person, Mina. Has to shows that the rule requires it.","explain":"Has to expresses an obligation. The singular subject Mina takes has.","scene":"girl","dskpTopic":"Year 6 modal expressions for obligation: have to","learningStandard":"2.1.2 (supporting language practice)","kbat":false,"cognitiveLevel":"remember"},{"prompt":"The sign says: \"Helmets are required. Gloves are optional.\" Which message explains both rules accurately?","options":["You don't have to wear a helmet, but you must wear gloves.","You must wear a helmet, but you don't have to wear gloves.","You must wear a helmet, and you must wear gloves."],"answer":"You must wear a helmet, but you don't have to wear gloves.","full":"You must wear a helmet, but you don't have to wear gloves.","hint":"Required means an obligation. Optional means you may choose, so it is not required.","explain":"Must wear a helmet expresses the required action. Don't have to wear gloves means gloves are optional; it does not forbid them.","scene":"friends","dskpTopic":"Year 6 modal verbs for obligation","learningStandard":"2.1.2 (supporting language practice)","kbat":true,"cognitiveLevel":"analyse","kbatRationale":"The pupil distinguishes a compulsory item from an optional item and checks both clauses against the sign; every option uses grammatical obligation expressions."},{"prompt":"Ravi's water bottle is empty. Station A has drinking water and is five minutes away, but it is closed until tomorrow. Station B also has drinking water, is forty-five minutes away and is open now. Which advice fits his need and the opening times?","options":["You should fill your bottle at Station A because it is closer.","You should skip both stations because your bottle is full.","You should fill your bottle at Station B because it is open now."],"answer":"You should fill your bottle at Station B because it is open now.","full":"You should fill your bottle at Station B because it is open now.","hint":"A shorter journey helps only if the station can provide water now. Check whether each place is open.","explain":"Ravi needs water now. A is closer but closed; B is open. B is therefore the usable place in the stated choices, and the reason correctly explains that decision.","scene":"friends","dskpTopic":"Year 6 modal verbs for advice; recycled comparisons and because","learningStandard":"2.1.3 / 3.2.2 (supporting language practice)","kbat":true,"cognitiveLevel":"evaluate","kbatRationale":"The pupil identifies the need, weighs distance against availability and rejects the tempting nearer but closed option; each option uses the same correct should structure."},{"prompt":"The rescue hall rule says everyone must keep quiet. The cat hides when it hears loud sounds. Amir suggests blowing a whistle; Lina suggests waiting calmly. Which message respects the rule and the cat's behaviour?","options":["We must keep the hall quiet, so we should blow the whistle.","We must keep the hall quiet, so we should wait calmly.","We don't have to keep the hall quiet, so we should shout."],"answer":"We must keep the hall quiet, so we should wait calmly.","full":"We must keep the hall quiet, so we should wait calmly.","hint":"Test each action against the quiet rule and the cat's reaction to loud sounds.","explain":"Waiting calmly keeps the hall quiet and avoids the loud sounds that make the cat hide. Must states the rule; should recommends the suitable action.","scene":"friends","dskpTopic":"Year 6 modal verbs for obligation and advice; recycled so","learningStandard":"2.1.2 / 2.1.3 (supporting language practice)","kbat":true,"cognitiveLevel":"evaluate","kbatRationale":"The pupil evaluates two proposed actions against both an external rule and behavioural evidence, choosing a recommendation with a consistent reason."}]},{"id":"y6h-castle","title":"Castle Evidence","subtitle":"Use more than one comparison clue","topic":"as ... as · enough · comparative and superlative forms","type":"compare","icon":"castle","color":"#e5b3f0","x":89,"y":73,"guide":"Look at the objects and read all the clues. Tap the one that fits.","taskLabel":"Castle light switched on","reminder":"Remember: As tall as means the same height. For a reasoning challenge, one matching clue is not enough: check every condition.","tasks":[{"prompt":"Tower A and Tower B have the same height. Choose the other tower that is as tall as Tower A.","objects":[{"id":"a","label":"Tower A","size":96},{"id":  focuses on the thing receiving the action. Enough means a need is met; not enough means it is not met.","The bags are made from old shirts. This tray has enough cups."],["bridge","Reports and checking questions","said + reported message · positive statement, negative tag?","In a past-form report, check pronouns and the changed verb. Question tags check understanding; match the tag to the statement.","Sara said she was ready. You carry a map, don't you? We can't enter, can we?"],["train","Experience and duration","have / has + past participle · ever · for / since · How long?","Ever asks about experience up to now. For gives a length of time. Since gives a starting point. How long asks for duration.","Have you ever visited Sabah? Hana has lived here since 2022."],["boat","Past actions and former habits","was / were + verb-ing + when + past event · used to + base verb","Past continuous describes a past action in progress. Past simple can name an event during it. Used to describes a past habit or situation.","He was reading when the bell rang. She used to be a farmer."],["pickaxe","Possibility and careful evidence","may / might / could + base verb · someone / nobody / nothing","A possibility is not a proven fact. Check which places or people are known, and which are still unknown. Nobody means no person; nothing means no thing.","The key might be on the table. Nobody has checked it yet."],["portal","Conditions and future plans","If + present simple, will + base verb · be going to · timetable present simple","Match a condition to its correct result. Going to can describe a plan. A fixed future timetable can use present simple.","If it rains, we will use the hall. The train leaves at nine tomorrow."],["cat","Rules and reasoned advice","should + base verb · must + base verb · have / has to · do not have to","Should gives advice. Must and have to can express an obligation. Do not have to means not required. A good reason must match the evidence.","You must wear a helmet, but you don't have to wear gloves."],["castle","Comparison decisions","as tall as · taller than · the tallest · big enough","As ... as compares equal qualities. A comparative relates things; a superlative gives an extreme in a group. Check every condition before choosing.","Chest B is big enough for seven gems and smaller than Chest C."]],"curriculum":{"document":"KSSR (Semakan 2017) Standards-Based English Language Curriculum, Sekolah Kebangsaan, Year 6; Bahagian Pembangunan Kurikulum, Ministry of Education Malaysia, January 2022","title":"Year 6 DSKP challenge grammar practice · 6S","url":"https://www.teacherfiera.com/wp-content/uploads/2020/04/2.-DSKP-KSSR-Semakan-2017-Bahasa-Inggeris-Tahun-6-SK_ISBN.pdf","grammarPages":"Printed syllabus pages 44–46; PDF pages 58–60. Earlier grammar: printed pages 52–53; PDF pages 66–67. HOTS: printed page 12; PDF page 26.","learningStandards":[{"code":"2.1.1 / 4.2.1","focus":"Language for sharing details about personal situations and experiences."},{"code":"2.1.2","focus":"Language for explaining what rules require."},{"code":"2.1.3","focus":"Advice supported by a relevant reason."},{"code":"2.1.4 / 4.2.2","focus":"Language for communicating planned or expected future actions."},{"code":"2.2.1","focus":"Checking an understood message during an exchange."},{"code":"2.3.1 / 4.2.3","focus":"Language for recounting past or imagined events."},{"code":"3.2.2","focus":"Understanding and relating details in written information."},{"code":"4.2.5","focus":"Reference pronouns and conjunctions that make connected ideas clear."},{"code":"4.3.3","focus":"Editing language so that a draft matches the intended meaning."}],"note":"Original Year 6 SK grammar activities for a higher-ability class. Topic boundaries follow the Year 6 grammar list and permitted recycling of earlier primary grammar. The challenge comes from connected clues, evidence, editing and decisions. These short tasks practise supporting language; they do not assess the full longer-text, interaction or two-paragraph learning standards, and game scores are not a PBD performance level.","kbatDefinition":"The KPM/BPK Year 6 DSKP, printed page 12, describes HOTS as using knowledge, skills and values for reasoning, reflection, problem solving and decisions, across applying, analysing, evaluating and creating. Here, a KBAT item requires a contextual inference or a decision against multiple facts or criteria; a direct form-recall, guided word-order or single comparison item is not counted. The task-level cognitiveLevel and kbatRationale record that distinction.","kbatCount":20,"kbatSource":{"url":"https://www.teacherfiera.com/wp-content/uploads/2020/04/2.-DSKP-KSSR-Semakan-2017-Bahasa-Inggeris-Tahun-6-SK_ISBN.pdf","page":"Printed page 12; PDF page 26","source":"KPM/BPK Year 6 SK DSKP, January 2022, Table 4"}}}};
const classByCode=code=>ROSTER.classes.find(c=>c.code===code);
const studentById=id=>ROSTER.students.find(s=>s.id===id);
const packForClass=code=>CONTENT_PACKS[classByCode(code)?.packId||'y6-supported'];
const missionsFor=id=>packForClass(studentById(id)?.classCode).missions;
let MISSIONS=CONTENT_PACKS['y6-supported'].missions,RULES=CONTENT_PACKS['y6-supported'].rules;
function usePack(code){const pack=packForClass(code);MISSIONS=pack.missions;RULES=pack.rules;}

 /* Shared client/server validation. Mission IDs and the v1 save format stay stable. */
const ProgressModel=(()=>{
 const avatars=new Set(['explorer','boy','girl','knight']);
 const date=v=>typeof v==='string'&&Number.isFinite(Date.parse(v))?v:null;
 const integer=(v,max=500)=>Number.isInteger(v)&&v>=0?Math.min(max,v):0;
 function clean(studentId,raw={},forcedVersion){
  if(!raw||raw.version!==1||raw.studentId!==studentId)raw={};
  const p={version:1,studentId,avatar:avatars.has(raw.avatar)?raw.avatar:'explorer',records:{},drafts:{},updatedAt:date(raw.updatedAt)};
  if(Number.isInteger(forcedVersion)&&forcedVersion>=0)p.resetVersion=forcedVersion;
  else if(Number.isInteger(raw.resetVersion)&&raw.resetVersion>=0)p.resetVersion=raw.resetVersion;
  for(const m of missionsFor(studentId))for(let i=0;i<m.tasks.length;i++){
   const key=m.id+':'+i,q=raw.records?.[key];if(!q||typeof q!=='object')continue;
   const wrong=integer(q.wrongAttempts),correct=q.correct===true,hints=q.hintsUsed===true;
   p.records[key]={correct,wrongAttempts:wrong,hintsUsed:hints,firstTry:correct&&q.firstTry===true&&wrong===0&&!hints,solvedAt:correct?date(q.solvedAt):null};
  }
  for(const m of missionsFor(studentId)){const d=raw.drafts?.[m.id];if(!d||!Number.isInteger(d.index)||d.index<0||d.index>=m.tasks.length||!Array.isArray(d.chosen)||p.records[m.id+':'+d.index]?.correct)continue;
   p.drafts[m.id]={index:d.index,chosen:[...new Set(d.chosen.filter(i=>Number.isInteger(i)&&i>=0&&i<(m.tasks[d.index].words?.length||0)))]};
  }
  return p;
 }
 function merge(studentId,previous,incoming,resetVersion){
  const old=clean(studentId,previous,resetVersion),fresh=clean(studentId,incoming,resetVersion),p=clean(studentId,fresh,resetVersion);
  for(const m of missionsFor(studentId))for(let i=0;i<m.tasks.length;i++){
   const k=m.id+':'+i,a=old.records[k],b=fresh.records[k];if(!a&&!b)continue;
   if(a?.correct){p.records[k]={...a};continue;}
   if(!b){p.records[k]={...a};continue;}
   const wrong=Math.max(a?.wrongAttempts||0,b.wrongAttempts),hints=Boolean(a?.hintsUsed||b.hintsUsed);
   p.records[k]={...b,wrongAttempts:wrong,hintsUsed:hints,firstTry:b.correct&&b.firstTry&&wrong===0&&!hints};
  }
  for(const m of missionsFor(studentId)){const d=p.drafts[m.id];if(d&&p.records[m.id+':'+d.index]?.correct)delete p.drafts[m.id];}
  return p;
 }
 function score(progress){let completed=0,firstTry=0,hints=0,wrong=0,started=false,reasoningCompleted=0,reasoningFirstTry=0;const bank=missionsFor(progress?.studentId),missions=bank.map(m=>{
   let done=0,first=0,help=0,errors=0,reasoningDone=0,reasoningFirst=0;for(let i=0;i<m.tasks.length;i++){const q=progress?.records?.[m.id+':'+i];if(!q)continue;if(q.correct){done++;if(q.firstTry)first++;if(m.tasks[i].kbat===true){reasoningDone++;if(q.firstTry)reasoningFirst++;}}if(q.hintsUsed)help++;errors+=q.wrongAttempts||0;if(q.correct||q.hintsUsed||q.wrongAttempts>0)started=true;}
   reasoningCompleted+=reasoningDone;reasoningFirstTry+=reasoningFirst;completed+=done;firstTry+=first;hints+=help;wrong+=errors;return{id:m.id,title:m.title,topic:m.topic,completed:done,total:m.tasks.length,firstTry:first,hints:help,wrong:errors,reasoningTotal:m.tasks.filter(t=>t.kbat===true).length,reasoningCompleted:reasoningDone,reasoningFirstTry:reasoningFirst};
  });const total=bank.reduce((n,m)=>n+m.tasks.length,0);return{completed,total,firstTry,hints,wrong,reasoningTotal:bank.flatMap(m=>m.tasks).filter(t=>t.kbat===true).length,reasoningCompleted,reasoningFirstTry,xp:completed*20+firstTry*10,percent:Math.round(completed/total*100),missionsComplete:missions.filter(m=>m.completed===m.total).length,status:completed===total?'complete':started?'in-progress':'not-started',missions};
 }
 return{clean,merge,score};
})();

 /* One shared loader: full screen for opening pages, a small badge for saves. */
const GameLoader=(()=>{
 const root=document.getElementById('game-loader');
 const message=document.getElementById('loader-message');
 const target=document.getElementById('app');
 const jobs=new Map();
 let sequence=0;
 const canPaint=()=>typeof requestAnimationFrame==='function';
 const now=()=>typeof performance!=='undefined'?performance.now():Date.now();
 const painted=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 function update(){
  const visible=[...jobs.values()].filter(job=>job.visible);
  const foreground=visible.filter(job=>job.blocking);
  const current=foreground.at(-1)||visible.at(-1);
  const blocking=foreground.length>0;
  if(target){target.inert=blocking;target.setAttribute?.('aria-busy',String(blocking));}
  if(!root)return;
  root.hidden=!current;
  root.setAttribute?.('aria-hidden',String(!current));
  if(!current){root.classList.remove('is-compact');return;}
  if(current.blocking)root.classList.remove('is-compact');else root.classList.add('is-compact');
  if(message)message.textContent=current.message;
 }
 function begin(label,{blocking=true,delay=0,minimum=280}={}){
  const id=++sequence;
  const job={message:label,blocking,visible:delay===0,started:now(),minimum,timer:null};
  jobs.set(id,job);
  if(delay)job.timer=setTimeout(()=>{if(jobs.has(id)){job.visible=true;job.started=now();update();}},delay);
  update();
  let finished=false;
  return()=>{
   if(finished)return;
   finished=true;
   clearTimeout(job.timer);
   const wait=job.visible&&canPaint()?Math.max(0,job.minimum-(now()-job.started)):0;
   const remove=()=>{jobs.delete(id);update();};
   if(wait)setTimeout(remove,wait);else remove();
  };
 }
 async function run(label,operation,options){
  const finish=begin(label,options);
  try{if(canPaint())await painted();return await operation();}
  finally{finish();}
 }
 function blocked(){return [...jobs.values()].some(job=>job.visible&&job.blocking);}
 function transition(label,operation,options){
  if(blocked())return;
  if(!canPaint())return operation();
  return run(label,operation,options).catch(()=>{if(typeof toast==='function')toast('Could not open this part. Please try again.');});
 }
 const finishBoot=begin('Loading GrammarCraft…',{minimum:320});
 function ready(){if(canPaint())painted().then(finishBoot);else finishBoot();}
 return{begin,run,transition,blocked,ready};
})();

 /* Per-player sync with revision checks and teacher reset protection. */
const CloudGame=(()=>{
 let token=null,playerId=null,revision=0,version=0,nonce=0,timer=null,pollTimer=null,busy=false,dirty=false,connecting=false;
 let status='local';
 const supported=()=>typeof fetch==='function'&&typeof location!=='undefined'&&/^https?:$/.test(location.protocol);
 const copy=p=>JSON.parse(JSON.stringify(p));
 const fingerprint=p=>JSON.stringify({avatar:p.avatar,records:p.records,drafts:p.drafts});
 const current=(id,n)=>state.student?.id===id&&n===nonce;
 function text(){return status==='saved'?'Saved for your teacher':status==='saving'?'Saving your progress…':status==='connecting'?'Connecting to your teacher…':status==='offline'?'Offline — progress kept on this device':'Progress saved on this device';}
 function setStatus(next){status=next;document.querySelectorAll?.('[data-sync-status]').forEach(el=>{el.textContent=text();});}
 async function request(path,payload,useToken=false){const headers={'Content-Type':'application/json'};if(useToken)headers.Authorization='Bearer '+token;const r=await fetch(path,{method:'POST',headers,credentials:'same-origin',body:JSON.stringify(payload),keepalive:true});let d;try{d=await r.json()}catch{throw new Error('Network unavailable')}return{ok:r.ok,status:r.status,data:d};}
 function store(progress){state.progress=progress;state.avatar=progress.avatar;safeWrite(SAVE_PREFIX+progress.studentId,JSON.stringify(progress));}
 function adopt(data,forceReset=false){
  const local=state.progress,id=state.student.id,compatible=(local.resetVersion===undefined&&data.resetVersion===0)||local.resetVersion===data.resetVersion;
  const p=!forceReset&&compatible?ProgressModel.merge(id,data.progress,local,data.resetVersion):ProgressModel.clean(id,data.progress,data.resetVersion);

function renderSidebar(){const s=stats();return `<aside class="sidebar"><div class="profile-box">${avatar(state.avatar)}<div class="name">${esc(state.student.full_name)}</div><div class="class-tag">EXPLORER · ${esc(classByCode(state.classCode).name)}</div></div>${[['map','map','Adventure map'],['book','book','Handbook'],['badges','trophy','Your badges'],['results','star','Achievement card']].map(([p,i,label])=>`<button class="nav-item ${state.page===p?'active':''}" data-action="nav" data-page="${p}" ${state.page===p?'aria-current="page"':''}>${icon(i,20)}${label}</button>`).join('')}<div class="sidebar-label">YOUR ADVENTURE</div><div class="progress-box"><div class="progress-title"><span>Your world is growing</span><span>${s.percent}%</span></div><div class="progress-bar" role="progressbar" aria-label="Adventure progress" aria-valuenow="${s.solved}" aria-valuemin="0" aria-valuemax="${TOTAL}"><div class="progress-fill" style="width:${s.percent}%"></div></div><p>${s.solved} / ${TOTAL} challenges complete<br>${s.missions} / 8 worlds explored</p></div><div class="side-tip">${icon('leaf',19)}<p>Take your time.<br>Have a break when you need one. Your world will wait for you.</p></div></aside>`;}
function shell(content){app.innerHTML=header()+`<div class="app-shell">${renderSidebar()}<main class="main-area"><div class="mobile-name"><span class="full-name">${esc(state.student.full_name)}</span><span>${esc(state.classCode)} · ${stats().solved}/${TOTAL}</span></div>${content}</main></div>`;}
function renderMap(){const s=stats(),next=nextMission();shell(`<div class="dashboard-heading"><div><span class="eyebrow">YOUR ADVENTURE MAP</span><h1>${s.solved===TOTAL?'Your world is complete!':'Let us build your world.'}</h1><p>${s.solved===0?'Choose your first world. Learn one block at a time.':s.solved===TOTAL?'Great work! Play a mission again to keep learning.':`${s.solved} ${s.solved===1?'challenge':'challenges'} complete. Keep exploring!`}</p></div><div class="stat-pills"><span class="stat-pill">${icon('diamond',19)}${s.solved} / ${TOTAL}</span><span class="stat-pill">${icon('star',19)}${s.xp} XP</span></div></div><section class="map-frame" aria-label="Map of eight game worlds"><div class="map-surface">${worldArt()}<div class="map-label">${icon('map',16)} GRAMMAR ISLAND · ${esc(state.classCode)}</div>${MISSIONS.map((m,i)=>`<button class="map-node ${missionCount(m)===5?'complete':''}" style="left:${m.x}%;top:${m.y}%" data-action="mission" data-mission="${m.id}" aria-label="Mission ${i+1}: ${m.title}. ${missionCount(m)} of 5 challenges complete"><span class="node-icon" style="background:${missionCount(m)===5?'#d5f5af':m.color}">${icon(m.icon,35)}<span class="node-number">${missionCount(m)===5?'✓':i+1}</span></span><span class="node-name">${esc(m.title)}</span><span class="node-count">${missionCount(m)}/5 ${missionCount(m)===5?'★':''}</span></button>`).join('')}<div class="next-tag">${s.solved===TOTAL?'ALL WORLDS COMPLETE!':`NEXT STOP: ${esc(next.title)}`}</div></div></section><div class="map-legend"><span><span class="dot"></span>Every world is ready to explore</span><span>Tap an icon or choose a mission below</span><span data-sync-status>${CloudGame.text()}</span></div><div class="section-title">Choose your mission<span>5 challenges in each world</span></div><section class="mission-list" aria-label="Choose a mission">${MISSIONS.map((m,i)=>`<button class="mission-card ${m.id===next.id?'current':''}" data-action="mission" data-mission="${m.id}">${icon(m.icon,30)}<div><h3>${i+1}. ${esc(m.title)}</h3><p>${esc(m.topic)} · ${missionCount(m)}/5</p><div class="tiny-progress"><span style="width:${missionCount(m)*20}%"></span></div></div></button>`).join('')}</section><div class="companion-tip">${icon('cat',32)}<p><strong>A tip from Blocky:</strong> Not sure? Tap “Help Me”. Learn one step at a time.</p></div><p class="footer-help"><button data-action="how">How to play</button> · No time limit · No lost lives</p>`);}
function openMission(id,practice=false){const m=MISSIONS.find(m=>m.id===id);if(!m)return;cancelSpeech();const first=m.tasks.findIndex((_,i)=>!state.progress.records[keyOf(m,i)]?.correct);if(first<0&&!practice){showDialog(`${icon(m.icon,65)}<h2 id="modal-title">World complete!</h2><p>You have completed every challenge in ${esc(m.title)}.</p><div class="star-line">${'★'.repeat(stars(m))}${'☆'.repeat(3-stars(m))}</div><div class="modal-buttons"><button class="btn flat" data-action="close-map">Back to map</button><button class="btn primary" data-action="practice" data-mission="${m.id}">Play again</button></div>`);return;}
 state.page='mission';state.mission=m;state.practice=practice;state.index=practice?0:first;prepareTask();renderMission();window.scrollTo({top:0,behavior:'auto'});}
function prepareTask(){const t=state.mission.tasks[state.index];state.chosen=[];state.shuffled=t.words?shuffle(t.words.map((_,i)=>i)):[];state.feedback=null;state.hintOpen=false;state.catPicked=false;state.placement=null;const draft=state.progress.drafts[state.mission.id];if(!state.practice&&t.words&&draft?.index===state.index)state.chosen=[...new Set(draft.chosen)];if(state.practice&&state.progress.records[keyOf(state.mission,state.index)]?.correct)state.practiceWrong=0;}
function savedDraft(){if(state.practice)return;state.progress.drafts[state.mission.id]={index:state.index,chosen:state.chosen.slice()};save();}
function hint(){const q=record();if(!q.correct){q.hintsUsed=true;save();}state.hintOpen=!state.hintOpen;renderMission();}
function answer(value){
 if(state.feedback?.correct)return;const t=state.mission.tasks[state.index],correct=value===t.answer,q=record();
 if(correct){const already=q.correct;if(!already){q.correct=true;q.firstTry=q.wrongAttempts===0&&!q.hintsUsed;q.solvedAt=new Date().toISOString();delete state.progress.drafts[state.mission.id];save();}state.feedback={correct:true,selected:value,first:q.firstTry,newlySolved:!already};blip(true);pulse();}
 else{if(!q.correct){q.wrongAttempts++;save();}state.feedback={correct:false,selected:value};blip(false);}
 renderMission();const feedback=document.getElementById('feedback');feedback?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}
function choiceMarkup(t,m){return `<div class="rune-options ${t.options.some(word=>word.length>28)?'sentence-options':''}" role="group" aria-label="Choose an answer block">${t.options.map(word=>`<button class="rune ${m.type==='bridge'?'bridge-rune':m.type==='mine'?'mine-rune':m.type==='portal'?'portal-rune':''} ${state.feedback?.selected===word?(state.feedback.correct?'correct':'wrong'):''}" data-action="answer" data-answer="${esc(word)}" ${state.feedback?.correct?'disabled':''}>${esc(word)}</button>`).join('')}</div>`;}
function buildMarkup(t){const done=state.feedback?.correct;return `<div class="sentence-track" aria-label="Your sentence">${state.chosen.length?state.chosen.map((i,pos)=>`<button class="word-tile" data-action="remove-word" data-pos="${pos}" aria-label="Remove ${esc(t.words[i])}" ${done?'disabled':''}>${esc(t.words[i])}</button>`).join(''):'<span class="track-placeholder">Tap the words to build your sentence here</span>'}</div><div class="word-bank" aria-label="Words to put in order">${state.shuffled.map(i=>`<button class="word-tile" data-action="add-word" data-index="${i}" ${done||state.chosen.includes(i)?'disabled':''}>${esc(t.words[i])}</button>`).join('')}</div>${!done?`<div class="build-actions"><button class="btn flat small-btn" data-action="clear-words">Start again</button><button class="btn primary" data-action="check-build" ${state.chosen.length!==t.words.length?'disabled':''}>${icon('check',17)}${state.mission.type==='train'?'Move the train':'Launch the boat'}</button></div>`:''}`;}
function placeMarkup(){const labels={in:'Box',on:'Table top',under:'Below table',behind:'Behind tree',between:'Between rocks'};return `<div class="rescue-layout"><button class="cat-pickup ${state.catPicked?'selected':''}" data-action="pick-cat" draggable="true" aria-pressed="${state.catPicked}" ${state.feedback?.correct?'disabled':''}>${icon('cat',35)}${state.catPicked?'Cat selected. Tap its place!':'1. Tap or drag this cat'}</button><div class="rescue-board">${rescueArt()}${Object.entries(labels).map(([key,label])=>`<button class="drop-zone zone-${key} ${state.placement===key?'placed':''}" data-action="place-cat" data-zone="${key}" aria-label="Place the cat: ${esc(label)}" ${state.feedback?.correct?'disabled':''}>${state.placement===key?icon('cat',32):'<span>+</span>'}<span class="zone-label">${esc(label)}</span></button>`).join('')}</div></div>`;}
function compareMarkup(t){return `<div class="comparison-stage" role="group" aria-label="Choose the object that matches the instruction">${t.objects.map(o=>`<button class="comparison-object ${state.feedback?.selected===o.id?(state.feedback.correct?'selected-good':'selected-wrong'):''}" data-action="answer" data-answer="${o.id}" aria-label="${esc(o.label)}" ${state.feedback?.correct?'disabled':''}>${objectArt(t.objectType||'tower',o.size,state.feedback?.correct&&state.feedback.selected===o.id)}<span>${esc(o.label)}</span></button>`).join('')}</div>`;}
function renderMission(){
 const m=state.mission,t=m.tasks[state.index],won=state.feedback?.correct,count=missionCount(m),q=state.progress.records[keyOf(m,state.index)];const text=state.feedback?.correct?t.explain:state.feedback?'Not quite. Read the hint and try again. You can do it!':'';
 const controls=t.words?buildMarkup(t):m.type==='place'?placeMarkup():m.type==='compare'?compareMarkup(t):choiceMarkup(t,m);
 shell(`<button class="back-link" data-action="nav" data-page="map">${icon('back',15)}Back to map</button><div class="mission-heading"><div><span class="eyebrow">${state.practice?'PLAY AGAIN':'MISSION '+(MISSIONS.indexOf(m)+1)} · ${esc(m.subtitle)}</span><h1>${esc(m.title)}</h1><p>${esc(m.topic)}</p></div><div class="mission-indicators" aria-label="Challenge ${state.index+1} of 5">${m.tasks.map((_,i)=>`<span class="${i===state.index?'now':state.progress.records[keyOf(m,i)]?.correct?'done':''}"></span>`).join('')}</div></div><section class="game-frame"><div class="game-scene ${m.type==='mine'?'mine-scene':m.type==='portal'?'portal-scene':''} ${won?'win-scene':''}">${sceneArt(m,Math.max(0,count-(won&&state.feedback.newlySolved?1:0)),state.avatar,won)}<div class="scene-bubble">${won?`${m.taskLabel}! +${state.feedback.newlySolved?(q.firstTry?'30':'20'):'0'} XP`:esc(m.guide)}</div><div class="scene-badge">${state.index+1} / ${m.tasks.length} CHALLENGES</div></div><div class="game-controls"><div class="prompt-row"><div><div class="prompt-label">${t.kbat===true?'<span class="reasoning-tag">Think it through</span> ':''}${t.words?'Build the sentence':m.type==='place'?'Find the right place for the cat':m.type==='compare'?'Tap the correct object':'Choose a block to continue'}</div><p class="prompt ${t.words?'build-prompt':''}" id="task-prompt" lang="en">${esc(t.prompt)}</p></div><div class="assist-actions"><button class="btn flat small-btn" data-action="listen">${icon('sound',16)}Listen</button><button class="btn flat small-btn" data-action="hint" aria-expanded="${state.hintOpen}">${icon('help',16)}Help Me</button></div></div><p class="guide-line">${t.words?'Tap the words in order. Tap a word in your sentence to remove it.':m.type==='place'?'2. Tap the correct place. You can also drag and drop the cat.':m.type==='compare'?'Look at the sizes. Tap the object you choose.':m.type==='mine'?'Tap a word block to mine it.':m.type==='portal'?'Tap a word portal to open it.':'Tap the correct word block.'}</p>${controls}${state.hintOpen?`<div class="hint-box">💡 ${esc(t.hint)}</div>`:''}${state.feedback?`<div class="feedback ${won?'':'wrong-feedback'}" id="feedback" role="status" aria-live="polite"><div class="feedback-icon">${won?icon('check',27):icon('help',27)}</div><div><strong>${won?'Great job! You did it!':'Try again, explorer.'}</strong><p>${esc(text)}</p>${won&&t.words?`<p lang="en"><strong>${esc(t.full)}</strong></p>`:''}</div>${won?`<button class="btn primary small-btn" data-action="next">${state.index===m.tasks.length-1?'Finish mission':'Next'}${icon('arrow',15)}</button>`:''}</div>`:''}</div></section><div class="mission-foot"><span>${icon('diamond',14)} ${count} / 5 challenges complete</span><span data-sync-status>${CloudGame.text()}</span></div><div class="companion-tip">${icon('cat',30)}<p>${m.reminder?esc(m.reminder):m.type==='mine'?'<strong>Remember:</strong> Yesterday and last week tell us about the past.':m.type==='portal'?'<strong>Remember:</strong> Tomorrow and next week tell us about the future.':m.type==='train'?'<strong>Remember:</strong> Start a sentence with a capital letter. Finish with a full stop.':m.type==='build'?'<strong>Remember:</strong> Actions happening now use am / is / are + a verb ending in -ing.':'<strong>Blocky says:</strong> Tap “Help Me” when you need a hint. We are learning together.'}</p></div>`);
}
function goNext(){cancelSpeech();if(!state.feedback?.correct)return;const m=state.mission;let next=state.index+1;if(!state.practice)while(next<m.tasks.length&&state.progress.records[keyOf(m,next)]?.correct)next++;if(next<m.tasks.length){state.index=next;prepareTask();renderMission();window.scrollTo({top:0,behavior:'auto'});}else completeMission();}
function completeMission(){const m=state.mission;save();pulse();showDialog(`${icon(m.icon,70)}<span class="tag gold" style="margin-top:17px">MISSION COMPLETE</span><h2 id="modal-title">${esc(m.title)} complete!</h2><p>You completed all 5 challenges.<br>Your world is growing!</p><div class="star-line">${'★'.repeat(stars(m))}${'☆'.repeat(3-stars(m))}</div><p>${firstCount(m)} / 5 correct on the first try without hints.<br>All 5 challenges complete.</p><div class="modal-buttons"><button class="btn primary" data-action="close-map">${icon('map',17)}${stats().solved===TOTAL?'View achievement card':'Back to map'}</button></div>`);}
function renderResults(){const s=stats();shell(`<div class="results-header"><span class="tag gold">${icon('trophy',15)} EXPLORER ACHIEVEMENT CARD</span><h1>${s.solved===TOTAL?'You did it, explorer!':'Every step counts.'}</h1><p>${s.solved===TOTAL?'You explored every world. Show your achievement card to your teacher!':'Save your achievement card or keep exploring.'}</p></div><section class="result-card" id="achievement-card"><div class="result-banner">${avatar(state.avatar)}<div><span class="eyebrow">GRAMMARCRAFT · ENGLISH</span><strong>${esc(state.student.full_name)}</strong><p>${esc(classByCode(state.classCode).name)} / ${esc(state.classCode)} · SK SUNGAI ABONG</p></div></div><div class="result-stats"><div class="result-stat"><strong>${s.solved}/${TOTAL}</strong><p>CHALLENGES COMPLETE</p></div><div class="result-stat"><strong>${s.first}/${TOTAL}</strong><p>FIRST TRY CORRECT</p></div><div class="result-stat"><strong>${s.xp}</strong><p>EXPLORER XP</p></div></div><table class="result-table"><thead><tr><th>GRAMMAR WORLD</th><th>PROGRESS</th><th>FIRST TRY</th></tr></thead><tbody>${MISSIONS.map(m=>`<tr><td><strong>${esc(m.title)}</strong><br><span class="muted">${esc(m.topic)}</span></td><td><span class="result-status ${missionCount(m)===5?'':'waiting'}">${missionCount(m)}/5 complete</span></td><td>${firstCount(m)}/5</td></tr>`).join('')}</tbody></table><div class="result-explanation">${s.missions} / 8 missions complete · ${s.hints} ${s.hints===1?'challenge used a hint':'challenges used hints'}.<br>“First try correct” means your first answer was correct without using Help Me. Corrected answers still count as completed challenges.<br>${state.progress.updatedAt?'Last saved: '+esc(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuala_Lumpur',dateStyle:'medium',timeStyle:'short'}).format(new Date(state.progress.updatedAt))):'No challenges started yet.'}<br>Your progress is saved for your teacher when you are online.</div></section><div class="result-actions"><button class="btn primary" data-action="download-card">${icon('diamond',18)}Save card image</button><button class="btn" data-action="print">Print / PDF</button><button class="btn flat" data-action="nav" data-page="map">Keep playing</button></div><p class="footer-help">Send your card image or a screenshot to your teacher.</p>`);}

function renderBadges(){shell(`<section class="library-page"><span class="eyebrow">YOUR TROPHY ROOM</span><h1>Your explorer badges.</h1><p>Complete all 5 challenges in a world to earn its badge. Every corrected answer helps you learn.</p><div class="badge-grid">${MISSIONS.map(m=>`<article class="badge-card ${missionCount(m)===5?'earned':'locked'}">${icon(m.icon,48)}<h3>${esc(m.title)}</h3><p>${missionCount(m)===5?'Badge earned!':'Complete '+(5-missionCount(m))+' more '+(5-missionCount(m)===1?'challenge.':'challenges.')}</p><p style="color:#bd912a;font-size:20px;margin-top:8px">${missionCount(m)===5?'★'.repeat(stars(m))+'☆'.repeat(3-stars(m)):'☆ ☆ ☆'}</p></article>`).join('')}</div></section>`);}

function downloadCard(onReady=()=>{}){
 const s=stats(),c=document.createElement('canvas');c.width=1080;c.height=1460;const ctx=c.getContext('2d');if(!ctx){toast('The card image is not available. Use Print / PDF or take a screenshot.');onReady();return;}
 ctx.fillStyle='#f7f5e9';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#2c4d35';ctx.fillRect(36,36,1008,1388);ctx.fillStyle='#fffdf3';ctx.fillRect(45,45,990,1370);ctx.fillStyle='#e3efd2';ctx.fillRect(45,45,990,320);ctx.fillStyle='#315535';ctx.font='bold 46px monospace';ctx.fillText('GRAMMARCRAFT',90,115);ctx.font='bold 22px sans-serif';ctx.fillText('ENGLISH · EXPLORER ACHIEVEMENT',90,159);
 function wrap(text,x,y,maxWidth,size,lineH){ctx.font=`bold ${size}px sans-serif`;let line='';for(const w of text.split(' ')){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxWidth&&line){ctx.fillText(line,x,y);line=w;y+=lineH;}else line=t;}ctx.fillText(line,x,y);return y;}
 let yy=wrap(state.student.full_name,90,217,890,27,37);ctx.font='20px sans-serif';ctx.fillStyle='#647654';ctx.fillText(classByCode(state.classCode).name+' / '+state.classCode+' · SK SUNGAI ABONG',90,yy+44);
 const values=[[`${s.solved}/${TOTAL}`,'CHALLENGES COMPLETE'],[`${s.first}/${TOTAL}`,'FIRST TRY CORRECT'],[`${s.xp}`,'EXPLORER XP']];values.forEach(([v,label],i)=>{const x=210+i*330;ctx.fillStyle='#3f7546';ctx.font='bold 54px monospace';ctx.textAlign='center';ctx.fillText(v,x,446);ctx.fillStyle='#78846c';ctx.font='bold 17px sans-serif';ctx.fillText(label,x,479);});ctx.textAlign='left';ctx.fillStyle='#e8eedc';ctx.fillRect(80,518,920,40);ctx.fillStyle='#667559';ctx.font='bold 17px sans-serif';ctx.fillText('GRAMMAR WORLD',95,545);ctx.fillText('DONE',742,545);ctx.fillText('FIRST TRY',880,545);
 MISSIONS.forEach((m,i)=>{const y=599+i*73;ctx.fillStyle='#2d4430';ctx.font='bold 21px sans-serif';ctx.fillText(m.title,95,y);ctx.fillStyle='#78856e';ctx.font='16px sans-serif';ctx.fillText(m.topic,95,y+25);ctx.fillStyle='#3e7241';ctx.font='bold 23px monospace';ctx.fillText(`${missionCount(m)}/5`,743,y+9);ctx.fillText(`${firstCount(m)}/5`,903,y+9);ctx.strokeStyle='#e0e5d6';ctx.beginPath();ctx.moveTo(90,y+41);ctx.lineTo(995,y+41);ctx.stroke();});
 ctx.fillStyle='#667b55';ctx.font='bold 19px sans-serif';ctx.fillText(`${s.missions}/8 missions complete · ${s.hints} ${s.hints===1?'challenge used a hint':'challenges used hints'}`,92,1233);ctx.font='17px sans-serif';ctx.fillText('First try correct = a correct first answer without Help Me.',92,1270);ctx.fillText('Corrected answers still count as completed challenges.',92,1297);ctx.font='16px sans-serif';ctx.fillStyle='#889477';ctx.fillText(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuala_Lumpur',dateStyle:'medium',timeStyle:'short'}).format(new Date()),92,1360);
 c.toBlob(blob=>{if(!blob){toast('The image could not be saved. Take a screenshot instead.');onReady();return;}downloadBlob(blob,'GrammarCraft-'+state.classCode+'-'+state.student.full_name.replace(/[^A-Za-z0-9]+/g,'-')+'.png');toast('Your card image is ready. Send it to your teacher.');onReady();},'image/png');
}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function chooseClass(code){if(!classByCode(code))code='';state.classCode=code;state.mission=null;state.chosen=[];state.feedback=null;state.selectedId='';state.avatar='explorer';usePack(code);const last=safeRead(SAVE_PREFIX+'last'),student=ROSTER.students.find(s=>s.id===last&&s.classCode===code);if(student){state.selectedId=student.id;state.avatar=readProgress(student.id).avatar;}renderLobby();}
document.addEventListener('change',e=>{if(e.target.id==='class-select'){const code=e.target.value;GameLoader.transition('Opening your class…',()=>{chooseClass(code);document.getElementById('class-select')?.focus();},{minimum:180});}else if(e.target.id==='student-select'){state.selectedId=e.target.value;const s=ROSTER.students.find(s=>s.id===state.selectedId&&s.classCode===state.classCode);if(s)state.avatar=readProgress(s.id).avatar;else state.selectedId='';renderLobby();document.getElementById('student-select')?.focus();}});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el||el.disabled||GameLoader.blocked())return;const a=el.dataset.action;if(a.startsWith('teacher-')){TeacherUI.action(a,el);return;}
 if(a==='sound'){state.sound=!state.sound;safeWrite(SAVE_PREFIX+'sound',state.sound?'1':'0');render();return;}
 if(a==='avatar'){state.avatar=el.dataset.avatar;renderLobby();return;}
 if(a==='start'){confirmStart();return;}if(a==='enter'){closeDialog();GameLoader.transition('Opening your adventure…',enter);return;}if(a==='close'){closeDialog();return;}if(a==='how'){how();return;}
 if(a==='brand'){e.preventDefault();if(state.student)GameLoader.transition('Opening your adventure map…',()=>navigation('map'));return;}if(a==='nav'){const labels={map:'Opening your adventure map…',book:'Opening your handbook…',badges:'Opening your badges…',results:'Opening your achievement card…'};GameLoader.transition(labels[el.dataset.page]||'Opening your adventure…',()=>navigation(el.dataset.page));return;}
 if(a==='mission'){const m=MISSIONS.find(m=>m.id===el.dataset.mission);if(m)GameLoader.transition('Opening '+m.title+'…',()=>openMission(m.id));return;}
 if(a==='practice'){closeDialog();GameLoader.transition('Opening your practice world…',()=>openMission(el.dataset.mission,true));return;}
 if(a==='close-map'){closeDialog();GameLoader.transition('Opening your adventure…',()=>navigation(stats().solved===TOTAL?'results':'map'));return;}
 if(a==='listen'){listen();return;}if(a==='hint'){hint();return;}if(a==='answer'){answer(el.dataset.answer);return;}if(a==='next'){GameLoader.transition('Opening your next challenge…',goNext,{minimum:180});return;}
 if(a==='add-word'){const i=Number(el.dataset.index);if(!state.chosen.includes(i)&&!state.feedback?.correct){state.chosen.push(i);state.feedback=null;savedDraft();renderMission();}return;}
 if(a==='remove-word'){if(!state.feedback?.correct){state.chosen.splice(Number(el.dataset.pos),1);state.feedback=null;savedDraft();renderMission();}return;}
 if(a==='clear-words'){state.chosen=[];state.feedback=null;savedDraft();renderMission();return;}
 if(a==='check-build'){const t=state.mission.tasks[state.index];if(state.chosen.length!==t.words.length)return;answer(state.chosen.map(i=>t.words[i]).join(' '));return;}
 if(a==='pick-cat'){state.catPicked=!state.catPicked;renderMission();return;}
 if(a==='place-cat'){if(!state.catPicked){toast('Tap the cat first, then tap its place.');return;}state.placement=el.dataset.zone;state.catPicked=false;answer(el.dataset.zone);return;}
 if(a==='download-card'){GameLoader.transition('Preparing your achievement card…',()=>new Promise(resolve=>downloadCard(resolve)));return;}if(a==='print'){window.print();return;}
});
document.addEventListener('dragstart',e=>{if(e.target.closest('[data-action="pick-cat"]')&&!state.feedback?.correct){state.catPicked=true;e.dataTransfer?.setData('text/plain','grammarcraft-cat');if(e.dataTransfer)e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const zone=e.target.closest('[data-zone]');if(zone&&state.catPicked&&!state.feedback?.correct){e.preventDefault();zone.classList.add('drag-over');}});
document.addEventListener('dragleave',e=>{e.target.closest('[data-zone]')?.classList.remove('drag-over');});
document.addEventListener('drop',e=>{const zone=e.target.closest('[data-zone]');if(zone&&state.catPicked&&!state.feedback?.correct){e.preventDefault();state.placement=zone.dataset.zone;state.catPicked=false;answer(zone.dataset.zone);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.open&&state.page==='mission')GameLoader.transition('Opening your adventure map…',()=>navigation('map'));});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(state.page==='mission')savedDraft();else save();CloudGame.flush();cancelSpeech();}});
window.addEventListener('pagehide',()=>{if(state.page==='mission')savedDraft();else save();CloudGame.flush();});
state.sound=safeRead(SAVE_PREFIX+'sound')!=='0';render();CloudGame.init();TeacherUI.init();GameLoader.ready();

 </script>
 <noscript><style>.game-loader{display:none}</style><p>Enable JavaScript to play GrammarCraft.</p></noscript>
